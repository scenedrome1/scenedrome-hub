<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03100c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cashflow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>SCENEDROME Cashflow</title>
<link rel="icon" href="assets/s.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* SCENEDROME night: deep cinema green canvas with the brand's grain texture, gold as the one accent, Montserrat heavy for figures, Poppins light spaced caps for labels (like S T U D I O S). Layout: Keynote-style slide rail left, one "slide" per view right. */
  --bg:#03100c; --panel:rgba(8,28,23,.86); --panel-2:#0d2a23; --row-alt:rgba(12,38,31,.55); --line:#173c33;
  --ink:#eef3ef; --muted:#9fb9b0; --faint:#5f7f75;
  --navy:#0d2e27; --navy-2:#123a31;
  --gold:#d6a03d; --gold-2:#f0c46a;
  --a1:#f0c46a; --a2:#d6a03d; --a3:#a8741f;
  --grad:linear-gradient(90deg,var(--gold-2),var(--gold) 60%,var(--a3));
  --in:#5fd3a8; --out:#ef7d6c; --warn:#f0c46a; --info:#6cc3e0;
  --display:"Montserrat","Gotham","Helvetica Neue",Arial,sans-serif;
  --body:"Poppins","Helvetica Neue",Arial,sans-serif;
  --bgm:transparent; --panel-solid:#0a241d; --field:#06180f; --hover:#0f362c; --sec:#041611; --foot:#061b15; --drawer:#041510;
  --chip:#12302a; --goldsoft:#2a2210; --goldline:#5a4520; --starOff:#2c4a41; --topbg:rgba(3,16,12,.88); --chartText:#9fb9b0; --chartGrid:#173c33;
  color-scheme:dark;
}
/* Bright mode: only the data side turns light; the rail keeps the brand night look */
body.bright .main,body.bright #layer{
  --bgm:#eef2ed; --panel:#ffffff; --panel-solid:#ffffff; --panel-2:#f3f6f2; --row-alt:#f6f9f5; --line:#d4dfd8;
  --ink:#0b1c17; --muted:#36524a; --faint:#647e75;
  --field:#ffffff; --hover:#e9f2ec; --sec:#e6eee8; --foot:#edf3ee; --drawer:#f4f8f3; --chip:#edf3ee;
  --goldsoft:#fbf0d8; --goldline:#e0bd70; --starOff:#d3ddd7; --topbg:rgba(238,242,237,.95);
  --gold:#a8741f; --gold-2:#7f540c; --in:#0f7a50; --out:#c0392b; --chartText:#4d6a61; --chartGrid:#d4dfd8;
  color-scheme:light;
}
body.bright .main{background:var(--bgm);color:var(--ink)}
body.bright #layer{color:var(--ink)}
.phead .band{color:#eef3ef}.phead .band .fnt{color:#a9c4ba}.phead .meta .fld{min-width:0}.fld .dt{max-width:100%}.fld .dt .in.w-dt{min-width:0}
body.bright .mbar{color:#eef3ef}
body.bright .lg th{color:#e6f0eb}
body.bright .lg thead tr.grp th{color:#f0c46a}
body.bright .kpi.hero{background:linear-gradient(135deg,#fbf0d8,#ffffff 65%)}
body.bright .pcard,body.bright .card,body.bright .kpi{box-shadow:0 1px 2px rgba(10,40,30,.06)}
body.bright .in.pill,body.bright span.pill{filter:none}
body.bright .pill.st-Custom,.in.pill.st-Custom{background:#22343a;color:#c9d8de}
body.bright .pill.st-Pitching,body.bright .in.pill.st-Pitching{background:#dce9fd;color:#1d4f91}
body.bright .pill.st-Signed,body.bright .in.pill.st-Signed{background:#fbf2c4;color:#765f00}
body.bright .pill.st-InProduction,body.bright .in.pill.st-InProduction{background:#fde2c9;color:#9c4500}
body.bright .pill.st-Delivered,body.bright .in.pill.st-Delivered{background:#d5f2dc;color:#17652e}
body.bright .pill.st-Closed,body.bright .in.pill.st-Closed{background:#dbf2e3;color:#1b5e33}
body.bright .pill.st-DeliveredDue,body.bright .in.pill.st-DeliveredDue{background:#fbd9d6;color:#a3160d}
body.bright .pill.st-Canceled,body.bright .in.pill.st-Canceled{background:#e5e8e9;color:#5c676b}
body.bright .tpill.t-Warning{background:#fadcd8;color:#8e2418}body.bright .tpill.t-Payment{background:#d6f3ea;color:#0d5c47}body.bright .tpill.t-Feedback{background:#dcf0f7;color:#0f5670}
body.bright .sw span{background:#c9d6cf}body.bright .sw span::after{background:#fff}
body.bright .lg td.pre .in{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(100,126,117,.14) 6px 12px)}
body.bright .banner.warn{background:#fff6e0;border-color:#e0bd70;color:#6b4a0a}
.themebtn{display:inline-flex;align-items:center;gap:6px}
.themebtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.mbar .themebtn{margin-left:auto;background:none;border:1px solid #2a5a4c;border-radius:8px;color:#f0c46a;padding:5px 7px}
.mbar .themebtn+.save-dot{margin-left:8px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg) url("assets/bg.jpg") center top/cover fixed no-repeat;color:var(--ink);font:400 13.5px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:250px 1fr;height:100%}
/* ---------- slide rail ---------- */
.rail{background:rgba(2,12,9,.82);backdrop-filter:blur(6px);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 14px;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.brand .mark{position:absolute;right:-40px;bottom:-30px;width:110px;opacity:.06;pointer-events:none}
.wm{display:flex;align-items:baseline;gap:6px;position:relative}
.wm .d{font:400 30px/1 var(--script);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding:4px 2px 6px 0}
.wm .s{font:600 13px var(--display);letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.brand img.logo{width:100%;max-width:200px;display:block;position:relative}
.brand .sub{font:300 11px var(--body);letter-spacing:.42em;text-transform:uppercase;color:var(--faint);margin-top:6px;position:relative}
.nav{flex:1;overflow:auto;padding:10px 10px 16px}
.nav h6{font:400 10.5px var(--body);letter-spacing:.32em;text-transform:uppercase;color:var(--faint);margin:16px 8px 6px;display:flex;justify-content:space-between;align-items:center}
.nav a{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none;position:relative;margin-bottom:2px}
.nav a .no{font:500 11px var(--display);color:var(--faint);font-variant-numeric:tabular-nums}
.nav a .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a:hover{background:var(--panel);color:var(--ink)}
.nav a.on{background:rgba(214,160,61,.10);color:var(--gold-2)}
.nav a.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--grad)}
.nav a .dot{width:8px;height:8px;border-radius:50%}
.nav a.cx .lbl{text-decoration:line-through;opacity:.6}
.nav .add{width:100%;margin-top:6px;padding:8px;border:1px dashed var(--line);background:none;border-radius:8px;color:var(--muted)}
.nav .add:hover{border-color:var(--gold);color:var(--gold-2)}
.rail .foot{border-top:1px solid var(--line);padding:10px 12px;font-size:12px;color:var(--faint);display:flex;align-items:center;gap:8px}
.save-dot{width:8px;height:8px;border-radius:50%;background:var(--in)}
.save-dot.busy{background:var(--warn)} .save-dot.err{background:var(--out)}

/* ---------- main ---------- */
.main{overflow:auto;min-width:0;position:relative}
.top{position:sticky;top:0;z-index:5;background:var(--topbg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{font:800 28px/1.05 var(--display);letter-spacing:-.01em;text-transform:uppercase;margin:0;text-wrap:balance}
.top h1 small{display:block;font:300 11px var(--body);letter-spacing:.36em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.top .sp{flex:1}
.ctl{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--muted)}
.ctl input,.ctl select{background:none;border:0;width:70px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.ctl select{width:auto}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;color:var(--ink);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--grad);border:0;color:#1a1204;font-weight:600}
.btn.ghost{background:none}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger:hover{border-color:var(--out);color:var(--out)}
.btn[disabled]{opacity:.4;cursor:default}
.view{padding:22px 28px 60px;display:flex;flex-direction:column;gap:22px}

.banner{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--muted)}
.banner.warn{border-color:var(--goldline);color:#f0c46a}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative;overflow:hidden}
.kpi .k{font:400 10.5px var(--body);letter-spacing:.26em;text-transform:uppercase;color:var(--faint)}
.kpi .v{font:700 22px/1.2 var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap}
.kpi .h{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.hero{background:linear-gradient(135deg,rgba(214,160,61,.16),var(--panel) 65%);border-color:var(--goldline)}
.kpi.hero::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad)}
.pos{color:var(--in)} .neg{color:var(--out)} .mut{color:var(--muted)} .fnt{color:var(--faint)}

/* section cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font:700 17px/1.1 var(--display);margin:0;text-transform:uppercase;letter-spacing:.02em}
.card-h .note{font-size:12px;color:var(--faint)}
.card-h .sp{flex:1}
.card-b{padding:14px 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 11px;font-size:12px;color:var(--muted)}
.chip.on{background:var(--gold);color:#1a1204;border-color:var(--gold);font-weight:600}

/* ledger tables */
.tw{overflow-x:auto}
table.lg{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.lg th{background:var(--navy);font:500 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#b9d2c9;padding:8px 8px;text-align:left;white-space:nowrap;border-bottom:1px solid #1d4a40}
.lg thead tr.grp th{background:var(--navy-2);text-align:center;font-weight:300;letter-spacing:.38em;color:var(--gold-2);border-bottom:1px solid #21564a}
.lg th.n,.lg td.n{text-align:right}
.lg td{padding:4px 8px;border-bottom:1px solid #12322a;vertical-align:middle;white-space:nowrap}
.lg tbody tr:nth-child(even) td{background:var(--row-alt)}
.lg tbody tr:hover td{background:var(--hover)}
.lg tr.off td{opacity:.42}
.lg tr.sec td{background:var(--sec)!important;font:400 10.5px var(--body);letter-spacing:.34em;color:var(--gold)!important;text-transform:uppercase;color:var(--muted);padding:9px 8px}
.lg tfoot td{background:var(--foot);font-weight:700;border-top:1px solid var(--line);padding:9px 8px;border-bottom:0}
.lg tfoot tr.tot td{background:linear-gradient(90deg,var(--goldsoft),var(--foot));font-size:14px;border-top:1px solid var(--goldline)}
.lg td.idx{color:var(--faint);font:500 11px var(--display);width:28px}
.lg td.sub{font-size:11px;color:var(--faint)}
.lg .two{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.lg .two small{font-size:11px;color:var(--faint)}
.lg td.name a{color:var(--ink);text-decoration:none;font-weight:600}
.lg td.name a:hover{text-decoration:underline;text-decoration-color:var(--a2)}
.lg td.name small{display:block;color:var(--faint);font-size:11px}
.cur{color:var(--faint);font-size:11px;margin-right:3px}

input.in,select.in,textarea.in{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 6px;width:100%;min-width:60px;color:var(--ink)}
input.in:hover,select.in:hover,textarea.in:hover{border-color:var(--line);background:var(--field)}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--gold);background:var(--field);outline:none}
input.in.n{text-align:right;font-variant-numeric:tabular-nums}
input.in::placeholder,textarea.in::placeholder{color:#3d5c53}
select.in{appearance:none;-webkit-appearance:none;padding-right:16px;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - 9px) 52%,calc(100% - 5px) 52%;background-size:4px 4px;background-repeat:no-repeat}
select.in option{background:var(--panel);color:var(--ink)}
.dt{display:inline-flex;align-items:center;position:relative}.in.w-dt{min-width:118px;width:122px;padding-right:22px;font-variant-numeric:tabular-nums}.cal{position:absolute;right:4px;background:none;border:0;color:var(--faint);padding:2px;display:flex}.cal:hover{color:var(--gold-2)}.calpop{position:fixed;z-index:70;width:268px;background:var(--panel-solid);border:1px solid #2a5a4c;border-radius:12px;padding:10px;box-shadow:0 18px 40px rgba(0,0,0,.55)}
.calpop .ch{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.calpop .ch select{flex:1;background:var(--field);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:4px 6px;font:500 12px var(--body)}
.calpop .ch button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--gold-2);width:26px;height:26px;font-size:16px;line-height:1}
.calpop .cw,.calpop .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calpop .cw span{font:400 10px var(--body);letter-spacing:.12em;color:var(--faint);padding:4px 0;text-transform:uppercase}
.calpop .cg button{background:none;border:1px solid transparent;border-radius:7px;color:var(--ink);height:30px;font:500 12px var(--body);font-variant-numeric:tabular-nums}
.calpop .cg button:hover{background:#143c32}
.calpop .cg button.tod{border-color:var(--gold);color:var(--gold-2)}
.calpop .cg button.sel{background:var(--gold);color:#1a1204;font-weight:700}
.calpop .cf{display:flex;justify-content:space-between;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.calpop .cf button{background:none;border:0;color:var(--gold-2);font:500 12px var(--body);padding:4px 6px}
.in.w-xs{min-width:58px;width:66px} .in.w-s{min-width:96px} .in.w-m{min-width:140px} .in.w-l{min-width:180px} .in.w-xl{min-width:240px}

/* switch */
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--muted)}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw span{width:30px;height:17px;border-radius:999px;background:#24443b;position:relative;transition:background .15s;flex:none}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#9fb9b0;transition:transform .15s}
.sw input:checked+span{background:var(--gold)}
.sw input:checked+span::after{transform:translateX(13px);background:#03100c}
.sw input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}

/* status pill */
.in.pill{border-radius:999px;padding:3px 22px 3px 10px;font:600 12px var(--body);border:0;min-width:118px;width:auto}
.pill.st-Pitching,.in.pill.st-Pitching{background:#132c52;color:#8cbcff}
.pill.st-Signed,.in.pill.st-Signed{background:#3d3508;color:#f5dc5a}
.pill.st-InProduction,.in.pill.st-InProduction{background:#4a2508;color:#ffa552}
.pill.st-Delivered,.in.pill.st-Delivered{background:#0e3f1c;color:#6fe08a}
.pill.st-Closed,.in.pill.st-Closed{background:#173b26;color:#9be3b0}
.pill.st-DeliveredDue,.in.pill.st-DeliveredDue{background:#5a1416;color:#ff8a85}
.pill.st-Canceled,.in.pill.st-Canceled{background:#2a3134;color:#9aa5a9}
span.pill{white-space:nowrap;border-radius:999px;font:600 12px var(--body);display:inline-block}
.prog{display:flex;align-items:center;gap:8px;min-width:100px}
@media (min-width:1100px){.kpis.k4{grid-template-columns:repeat(4,1fr)}}
.bar{flex:1;height:6px;border-radius:6px;background:#173c33;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:6px}
.prog b{font:600 12px var(--display);color:var(--muted);width:32px;text-align:right}

/* payments drawer */
.pays td{background:var(--drawer)!important;padding:0 8px 10px 36px!important}
.pays .inner{border-left:2px solid var(--gold);padding:8px 0 0 12px}
.pays table{border-collapse:collapse;width:auto}
.pays th{font:600 11px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:left;padding:2px 6px}
.pays td.c{padding:2px 6px;background:none!important;border:0}
.pays tr.lockrow td.c{color:var(--faint);padding:6px}.lg td.locked{color:var(--faint)}
.pbtn{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--muted);white-space:nowrap}
.pbtn:hover{border-color:var(--gold);color:var(--ink)}
.pbtn.open{border-color:var(--gold);color:var(--gold-2);background:var(--goldsoft)}
.x{background:none;border:0;color:var(--faint);padding:4px 6px;border-radius:6px;font-size:14px;line-height:1}
.x:hover{color:var(--out);background:#2a1513}
.addrow{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}

/* project header */
.phead{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.phead .band{padding:18px 20px 16px;position:relative;overflow:hidden}
.phead .band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--grad)}
.phead .band input.title{font:800 32px/1.1 var(--display);text-transform:uppercase;letter-spacing:-.01em;background:none;border:1px solid transparent;border-radius:8px;color:#fff;width:100%;padding:2px 6px}
.phead .band input.title:hover,.phead .band input.title:focus{border-color:rgba(255,255,255,.25);outline:none}
.phead .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px;padding:14px 20px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>label,.fld>.l{font:400 10.5px var(--body);letter-spacing:.26em;text-transform:uppercase;color:var(--faint)}
.fld .in{background:var(--field);border-color:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 10px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--gold);color:#1a1204;font-weight:600}
.swatches{display:flex;gap:6px;align-items:center}
.swatches button{width:20px;height:20px;border-radius:50%;border:2px solid transparent}
.swatches button.on{border-color:var(--gold-2)}
.years{display:flex;gap:8px;flex-wrap:wrap}
.yr{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px}
.yr b{font:700 14px var(--display);color:var(--gold-2);margin-right:8px}

const today=()=>new Date().toISOString().slice(0,10);
const yearOf=d=>d?+String(d).slice(0,4):null;
const monthOf=d=>d?+String(d).slice(5,7):null;
const mkey=(y,m)=>y+"-"+String(m).padStart(2,"0");
function fmt(n,dec=0){n=Math.round(num(n)*10**dec)/10**dec;const s=Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec});return n<0?"−"+s:s}
const fmtIn=n=>num(n)?(+n).toLocaleString("en-US",{maximumFractionDigits:4}):"";
const egpH=(n,cls="")=>`<span class="${cls}"><span class="cur">EGP</span>${fmt(n)}</span>`;
const sign=n=>n<0?"neg":n>0?"pos":"mut";

/* ================= money ================= */
function rateOr(r){return num(r)||num(S.main.settings.usdRate)||1}
function toEGP(cur,amt,rate){return cur==="USD"?num(amt)*rateOr(rate):num(amt)}
function lineEGP(l){return toEGP(l.currency,l.amount,l.rate)}
function payEGP(p,fallbackRate){return toEGP(p.currency,p.amount,p.rate??fallbackRate)}
function sumPays(list,fb){let s=0;for(const p of list||[])s+=payEGP(p,fb);return s}
function taxPct(p){return p.taxMode==="none"?0:p.taxMode==="custom"?num(p.taxPct):num(S.main.settings.defaultTax)}

function calcProject(p){
  let deal=0,received=0,cost=0,paid=0;const byYear={};
  const add=(y,k,v)=>{y=y||"Undated";(byYear[y]??={in:0,out:0})[k]+=v};
  for(const l of p.income){deal+=lineEGP(l);for(const x of l.payments){const e=payEGP(x,l.rate);received+=e;add(yearOf(x.date),"in",e)}}
  for(const l of p.costs){cost+=lineEGP(l);for(const x of l.payments){const e=payEGP(x,l.rate);paid+=e;add(yearOf(x.date),"out",e)}}
  const t=taxPct(p);
  return {deal,received,toCollect:deal-received,cost,paid,toPay:cost-paid,tax:t,taxExp:deal*t/100,taxAct:received*t/100,
    netExp:deal-cost-deal*t/100,netAct:received-paid-received*t/100,byYear};
}
/* a new row's date moves into the selected year, so it shows up on the page you are on */
function toSelYear(d){const Y=S.main.settings.year;if(!d||yearOf(d)===Y)return d;let r=Y+String(d).slice(4);if(r.slice(5,10)==="02-29"&&new Date(Y,1,29).getMonth()!==1)r=Y+"-02-28";return r}
/* ===== standalone years: a year counts only payments dated in it. What is still unpaid is counted once, in the current year
   (or in the start year if that is later), so nothing is counted twice and nothing jumps between years ===== */
function remYear(startY){return startY||new Date().getFullYear()}
function splitYear(total,pays,fbRate,fbDate,startY,Y,closed){let paidY=0,paidAll=0;const R=remYear(startY);
  for(const x of pays||[]){const v=payEGP(x,fbRate);paidAll+=v;const y=yearOf(x.date||fbDate)||R;if(y===Y)paidY+=v}
  const rem=closed?0:Math.max(0,num(total)-paidAll);return {exp:paidY+(Y===R?rem:0),paid:paidY}}
/* projects over more than one year: each year's deal (or cost) is what was still open when the year started.
   What is received in a year stays in that year; the part not collected carries into the next year as its new amount. */
function projLastYear(p){return 9999}/* anything still owed keeps carrying until it is paid or the project is canceled */
function lineYear(l,firstY,Y,closed,lastY){const total=lineEGP(l);let before=0,paidY=0;const f=firstY||new Date().getFullYear();
  for(const x of l.payments||[]){const v=payEGP(x,l.rate),y=yearOf(x.date)||f;if(y<Y)before+=v;else if(y===Y)paidY+=v}
  let exp=paidY;if(!closed&&Y>=f&&Y<=lastY)exp=Math.max(paidY,total-before);return {exp,paid:paidY,before,open:Math.max(0,total-before)}}
function projLine(p,l,kind,Y){return lineYear(l,kind==="income"?(yearOf(l.due)||yearOf(p.start)):yearOf(p.start),Y,p.status==="Canceled",projLastYear(p))}
function calcProjectYear(p,Y){let deal=0,received=0,cost=0,paid=0,before=0,paidBefore=0;
  for(const l of p.income){const r=projLine(p,l,"income",Y);deal+=r.exp;received+=r.paid;before+=r.before}
  for(const l of p.costs){const r=projLine(p,l,"cost",Y);cost+=r.exp;paid+=r.paid;paidBefore+=r.before}
  const t=taxPct(p);return {deal,received,toCollect:deal-received,cost,paid,toPay:cost-paid,tax:t,taxExp:deal*t/100,taxAct:received*t/100,
    netExp:deal-cost-deal*t/100,netAct:received-paid-received*t/100,before,paidBefore}}
function rentPayDate(e){return e.paidDate||mkey(e.year,(num(e.q)-1)*3+1)+"-01"}
function rentYear(e,Y){return splitYear(num(e.amount),num(e.paid)?[{date:rentPayDate(e),currency:"EGP",amount:num(e.paid)}]:[],null,"",num(e.year),Y,false)}
function expYear(it,Y){return splitYear(toEGP(it.currency,it.cost,it.rate),it.payments,it.rate,it.date,yearOf(it.date),Y,false)}
/* which years a project runs in: start/end dates first, payment dates when a date is missing */
function projYears(p){const cy=new Date().getFullYear();const ys=[];for(const l of [...p.income,...p.costs])for(const x of l.payments){const y=yearOf(x.date);if(y)ys.push(y)}
  let from=yearOf(p.start),to=yearOf(p.end),derived=false;const done=["Delivered","Delivered $","Canceled"].includes(p.status);
  if(!from){from=ys.length?Math.min(...ys):null;derived=true}
  let open=false;if(!to){if(done){to=ys.length?Math.max(...ys,from||0):from;derived=true}else{open=true;to=Math.max(cy,from||cy,...ys)}}
  if(!from&&!to)return {from:null,to:null,open,derived:true,label:"Dates not set"};
  if(!from)from=to;
  const label=from===to&&!open?String(from):from+" → "+(open?"now":to);
  return {from,to,open,derived,label,toEff:open?9999:to}}
function yearBadge(p,Y){const y=projYears(p);if(!y.from)return `<span class="ybadge none" title="Set the start date on the project page">Dates not set</span>`;
  const on=y.from<=Y&&Y<=y.toEff;return `<span class="ybadge${on?" on":""}" title="${y.derived?"Estimated from payment dates. Set start and end dates on the project page.":"From the project's start and end dates"}">${esc(y.label)}${y.derived?" *":""}</span>`}
function projActiveIn(p,Y){const y=projYears(p);if(y.from&&y.from<=Y&&Y<=y.toEff)return true;
  for(const l of [...p.income,...p.costs])for(const x of l.payments)if(yearOf(x.date)===Y)return true;
  const a=yearOf(p.start),b=yearOf(p.end);
  if(a&&a<=Y&&(!b||b>=Y))return true;
  return false;
}
/* the selected year drives every page: things dated in another year are hidden, undated things always show until a date is set */
function projInYear(p,Y){if(!p.start)return true;if(projActiveIn(p,Y))return true;const c=calcProjectYear(p,Y);return !!(c.deal||c.cost||c.received||c.paid)}
function memberInYear(r,Y){return !r.start||yearOf(r.start)<=Y}
function expInYear(it,Y){if(!it.date||yearOf(it.date)===Y)return true;const e=expYear(it,Y);return !!(e.exp||e.paid)}
function subInYear(s,Y){const st=subStartYM(s);if(!st||+st.slice(0,4)<=Y)return true;return s.payments.some(x=>yearOf(x.date)===Y)}
function projVisible(p){
  if(ui.filter==="every")return true;
  if(!projInYear(p,S.main.settings.year))return false;
  if(ui.filter==="active")return !["Delivered","Canceled"].includes(p.status);
  return true;
}
function projList(){return S.main.order.map(id=>S.projects[id]).filter(Boolean)}

/* subscription plans: [{from:"YYYY-MM",plan,price,note}] — a plan applies from its month until the next change */
function planHist(s){if(!Array.isArray(s.planHist))s.planHist=[];s.planHist.sort((a,b)=>String(a.from).localeCompare(String(b.from)));return s.planHist}
function planAt(s,ym){let e=null;for(const h of planHist(s))if(String(h.from)<=ym)e=h;return e}
function subStartYM(s){const h=planHist(s)[0];return h?h.from:null}
function subExpected(s,Y,m){const ym=mkey(Y,m);if(s.zero&&s.zero[ym])return 0;const e=planAt(s,ym);if(!e||!num(e.price))return 0;const st=subStartYM(s);
  let due=0;if(s.billing==="Monthly")due=num(e.price);
  else if(s.billing==="Yearly"){const rm=s.renewal?monthOf(s.renewal):(st?+st.slice(5):1);if(m===rm)due=num(e.price)}
  else if(s.billing==="One-time"){if(st===ym)due=num(e.price)}
  return toEGP(s.currency,due,s.rate)}
function subPaidMonth(s,ym){let v=0;for(const x of s.payments)if(String(x.date).startsWith(ym))v+=payEGP(x,s.rate);return v}
function subYear(s,Y){let exp=0,paid=0;for(let m=1;m<=12;m++){exp+=subExpected(s,Y,m);paid+=subPaidMonth(s,mkey(Y,m))}return {exp,paid}}
function subAnnual(s){return subYear(s,S.main.settings.year).exp}
/* office expenses: a fixed monthly cost per item; typed cells are what was actually paid (EGP), 0 = not due that month */
function officeMonthly(it){return toEGP(it.currency,it.monthly,it.rate)}
function officeDue(it,Y,m){const k=mkey(Y,m);if(it.paid&&k in it.paid&&num(it.paid[k])===0)return 0;if(it.start){const sy=yearOf(it.start),sm=monthOf(it.start);if(Y<sy||(Y===sy&&m<sm))return 0}return officeMonthly(it)}
function officeYear(it,Y){let due=0,paid=0,planned=0;for(let m=1;m<=12;m++){const k=mkey(Y,m),d=officeDue(it,Y,m),v=num(it.paid[k]);due+=d;paid+=v;planned+=k in it.paid?v:d}return {due,paid,planned}}
function overhead(Y){
  const m=S.main,inc=m.settings.include;
  const sal={planned:0,paid:0,on:inc.salaries},rent={planned:0,paid:0,on:inc.rent},exp={planned:0,paid:0,on:inc.expenses},sub={planned:0,paid:0,on:inc.subscriptions},ast={planned:0,paid:0,on:inc.assets};
  for(const r of m.salaries){if(!r.include)continue;let paid=0;for(let i=1;i<=12;i++)paid+=num(r.paid[mkey(Y,i)]);const aj=adjSum(r,Y);paid+=aj.net;
    let due=0;for(let mm=1;mm<=12;mm++)due+=salaryDue(r,Y,mm);
    sal.planned+=Math.max(due+aj.net,paid);sal.paid+=paid}
  for(const it of m.rent){if(!it.include)continue;for(const e of it.schedule){const r=rentYear(e,Y);rent.planned+=r.exp;rent.paid+=r.paid}}
  for(const it of m.expenses){if(!it.include)continue;const e=expYear(it,Y);exp.planned+=e.exp;exp.paid+=e.paid}
  for(const it of m.office||[]){if(!it.include)continue;const o=officeYear(it,Y);exp.planned+=o.planned;exp.paid+=o.paid}
  for(const s of m.subscriptions){if(!s.include)continue;let pY=0;for(const x of s.payments)if(yearOf(x.date)===Y)pY+=payEGP(x,s.rate);
    sub.planned+=Math.max(subYear(s,Y).exp,pY);sub.paid+=pY}
  for(const it of m.assets){if(!it.include)continue;const e=expYear(it,Y);ast.planned+=e.exp;ast.paid+=e.paid}
  return {sal,rent,exp,sub,ast};
}
function customOverhead(Y){const out=[];for(const c of (S.main.custom||[])){if(c.cash!=="out"&&c.cash!=="in")continue;let t=0;
  for(const row of c.rows||[]){const d=row[c.dateCol];if(yearOf(d)===Y)t+=num(row[c.amountCol])}out.push({id:c.id,name:c.name||"Custom",cash:c.cash,planned:t,paid:t,on:S.main.settings.include["c-"+c.id]!==false})}return out}
/* every real money movement, respecting the on/off switches */
function flows(){
  const out=[],m=S.main,inc=m.settings.include;
  if(inc.salaries)for(const r of m.salaries){if(!r.include)continue;for(const k in r.paid){const v=num(r.paid[k]);if(v)out.push({date:k+"-01",amt:v,dir:"out",cat:"Salaries"})}
    for(const a of r.adj||[]){const v=num(a.amount);if(v&&a.date)out.push({date:a.date,amt:a.type==="Deduction"?-v:v,dir:"out",cat:"Salaries"})}}
  if(inc.rent)for(const it of m.rent){if(!it.include)continue;for(const e of it.schedule){const v=num(e.paid);if(v)out.push({date:rentPayDate(e),amt:v,dir:"out",cat:"Rent"})}}
  if(inc.expenses)for(const it of m.expenses){if(!it.include)continue;for(const x of it.payments){const v=payEGP(x,it.rate);if(v)out.push({date:x.date||it.date,amt:v,dir:"out",cat:"Expenses"})}}
  if(inc.expenses)for(const it of m.office||[]){if(!it.include)continue;for(const k in it.paid){const v=num(it.paid[k]);if(v)out.push({date:k+"-01",amt:v,dir:"out",cat:"Expenses"})}}
  if(inc.assets)for(const it of m.assets){if(!it.include)continue;for(const x of it.payments){const v=payEGP(x,it.rate);if(v)out.push({date:x.date||it.date,amt:v,dir:"out",cat:"Assets"})}}
  if(inc.subscriptions)for(const s of m.subscriptions){if(!s.include)continue;for(const x of s.payments){const v=payEGP(x,s.rate);if(v)out.push({date:x.date,amt:v,dir:"out",cat:"Subscriptions"})}}
  for(const c of (m.custom||[])){if((c.cash!=="out"&&c.cash!=="in")||inc["c-"+c.id]===false)continue;for(const row of c.rows||[]){const v=num(row[c.amountCol]),d=row[c.dateCol];if(v&&d)out.push({date:d,amt:v,dir:c.cash==="in"?"in":"out",cat:"c:"+(c.name||"Custom")})}}
  if(inc.projects)for(const p of projList()){if(!p.include)continue;
    for(const l of p.income)for(const x of l.payments){const v=payEGP(x,l.rate);if(v)out.push({date:x.date,amt:v,dir:"in",cat:"Projects"})}
    for(const l of p.costs)for(const x of l.payments){const v=payEGP(x,l.rate);if(v)out.push({date:x.date,amt:v,dir:"out",cat:"Project costs"})}}
  return out;
}
function cashPosition(){const o=S.main.settings;let c=num(o.openingBalance);for(const f of flows()){if(!f.date||f.date<o.openingDate)continue;c+=f.dir==="in"?f.amt:-f.amt}return c}

function normMain(m){

  m.settings.lists=m.settings.lists||{};m.settings.tabs=m.settings.tabs||{};m.custom=Array.isArray(m.custom)?m.custom:[];for(const c of m.custom){c.cols=c.cols||[];c.rows=c.rows||[];c.cash=c.cash||"none"}
  if(!m.assetsSplit){const keep=[];for(const it of m.expenses){if(["Device","Asset","Upgrade"].includes(it.category)){const n=String(it.name||"").toLowerCase();
      m.assets.push({id:it.id,date:it.date||"",category:/eizo|screen|monitor|display/.test(n)?"Monitor":/camera|black ?magic|bmpcc|red|sony|canon/.test(n)?"Camera":"Equipment",name:it.name||"",serial:it.serial||"",vendor:it.vendor||"",currency:it.currency||"EGP",cost:num(it.cost),rate:it.rate??null,condition:"Good",assignedTo:"",location:"Office",warranty:"",include:it.include!==false,note:it.note||"",payments:it.payments||[]});ui.migrated=true}else keep.push(it)}
    m.expenses=keep;m.assetsSplit=true}
  for(const r of m.salaries){r.paid=r.paid||{};r.type=r.type||"Not set";r.rating=r.rating||{};r.notes=r.notes||[];r.adj=r.adj||[];r.contact=r.contact||"";if(!Array.isArray(r.salHist)){r.salHist=num(r.monthly)?[{id:uid(),from:mkey(new Date().getFullYear(),1),amount:num(r.monthly),note:"Salary when history started"}]:[]}r.include??=true;r.active??=true}
  for(const it of m.rent){it.schedule=it.schedule||[];it.include??=true}
  for(const it of m.expenses){it.payments=it.payments||[];it.include??=true;it.currency=it.currency||"EGP"}
  for(const it of m.office){it.paid=it.paid||{};it.include??=true;it.currency=it.currency||"EGP"}
  for(const it of m.assets){it.payments=it.payments||[];it.include??=true;it.currency=it.currency||"EGP";it.condition=it.condition||"Good"}

const LEGACY_COL={"#123a3a":"#0f4a40","#4f1a26":"#4a2a1a","#1565c0":"#0b3a4a","#0b1f7a":"#0b3a4a","#24344f":"#1d3a2c","#5b2a86":"#6b4f1d","#7a7d82":"#2a3b38","#8a3b12":"#6b4f1d"};

  if(LEGACY_COL[p.color])p.color=LEGACY_COL[p.color];
  p.income=p.income||[];p.costs=p.costs||[];
  for(const l of [...p.income,...p.costs]){l.payments=l.payments||[];l.currency=l.currency||"EGP"}
  p.team=p.team||[];p.include??=true;if(p.status==="Closed"){let left=0;const fx=(c,a,r)=>c==="USD"?num(a)*(num(r)||50):num(a);for(const l of p.income){left+=fx(l.currency,l.amount,l.rate);for(const x of l.payments)left-=fx(x.currency,x.amount,x.rate??l.rate)}p.status=left>0.5?"Delivered $":"Delivered"}p.taxMode=p.taxMode||"default";p.status=p.status||"Pitching";p.progress=num(p.progress);

/* ================= persistence ================= */
function setSave(state,txt){const cls="save-dot"+(state==="busy"?" busy":state==="err"?" err":"");const d=document.getElementById("saveDot");d.className=cls;const d2=document.getElementById("saveDot2");if(d2){d2.className=cls;d2.title=txt}document.getElementById("saveTxt").textContent=txt}
let flushTimer=null,flushing=false;
function markDirty(k){if(!canWrite)return;dirty.add(k);setSave("busy","Unsaved changes…");clearTimeout(flushTimer);flushTimer=setTimeout(flush,700)}
function markAll(){markDirty("main");for(const id in S.projects)markDirty("p:"+id);for(const id of remoteIds)if(!S.projects[id])markDirty("p:"+id)}
async function flush(){
  if(flushing){clearTimeout(flushTimer);flushTimer=setTimeout(flush,400);return}
  if(mode==="local"){dirty.clear();try{localStorage.setItem(LOCAL_KEY,JSON.stringify(await sealObj(snapshot())));setSave("ok","Saved on this device (encrypted)")}catch(e){setSave("err","This device's storage is full: download a backup")}return}
  if(mode==="server"){flushing=true;setSave("busy","Saving…");const keys=[...dirty];dirty.clear();
    try{const r=await api("save",{method:"POST",body:JSON.stringify({version:srv.ver,data:await sealObj(snapshot())})});
      if(r.status===200){srv.ver=r.j.version;setSave("ok","Saved on server")}
      else if(r.status===409&&r.j){srv.ver=r.j.version||0;if(r.j.data){try{applyData(await openObj(r.j.data))}catch(_){}}setSave("ok","Saved on server");scheduleRender();toast("Someone saved from another device first. You're now seeing the latest; redo your last change if it's missing.")}
      else if(r.status===401){keys.forEach(k=>dirty.add(k));setSave("err","Key rejected: changes not saved")}
      else{keys.forEach(k=>dirty.add(k));setSave("err","Couldn't save. Retrying…");setTimeout(flush,5000)}}
    catch(_){keys.forEach(k=>dirty.add(k));setSave("err","Offline: will retry");setTimeout(flush,6000)}
    finally{flushing=false}return}
  if(!db){setSave("err","Not saved: open while signed in");return}
  flushing=true;setSave("busy","Saving…");let cur=null;
  try{
    for(const k of [...dirty]){
      cur=k;dirty.delete(k);
      if(k==="main"){await db.doc("books/main").set(await sealObj(S.main))}
      else{const id=k.slice(2);const ref=db.doc("projects/"+id);
        if(S.projects[id]){await ref.set(await sealObj(S.projects[id]));remoteIds.add(id)}
        else{await ref.delete();remoteIds.delete(id)}}
    }
    setSave("ok","All changes saved");
  }catch(e){
    if(e&&e.code==="invalid_argument"){canWrite=false;setSave("err","View only: changes are not saved");render()}
    else if(e&&e.code==="quota_exceeded"){setSave("err","Storage is full: changes not saved")}
    else{setSave("err","Couldn't save. Retrying…");if(cur)dirty.add(cur);setTimeout(flush,4000)}
  }finally{flushing=false}
}
function pushUndo(){undoStack.push(JSON.stringify(S));if(undoStack.length>40)undoStack.shift();updUndo()}

/* ===== data encryption: every saved copy is AES-GCM ciphertext; the key comes from the password at unlock ===== */
let DATA_KEY=null;
async function sealObj(o){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},DATA_KEY,new TextEncoder().encode(JSON.stringify(o)));return {enc:b64(new Uint8Array(ct)),iv:b64(iv),v:1}}
async function openObj(o){if(!o||!o.enc)return o;const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},DATA_KEY,unb64(o.enc));return JSON.parse(new TextDecoder().decode(pt))}
const isSealed=o=>!!(o&&o.enc&&o.iv);
function cryptoFail(){setSave("err","Locked");emptyState("These books can't be opened","They were saved with a different password. Lock the app and enter the password they were saved with.")}
/* ===== storage modes: claude (artifact database) · server (api.php on the NAS) · local (this browser) ===== */
let mode="claude";const srv={ver:0,poll:null};const LOCAL_KEY="scenedrome-cashflow-books";
function getKey(){try{return localStorage.getItem("sd-key")||""}catch(_){return ""}}
function applyData(o){S.main=normMain(JSON.parse(JSON.stringify(o.main)));S.projects={};for(const id in (o.projects||{}))S.projects[id]=normProject(JSON.parse(JSON.stringify(o.projects[id])));
  for(const id of Object.keys(S.projects))if(!S.main.order.includes(id))S.main.order.push(id);S.main.order=S.main.order.filter(id=>S.projects[id])}
function snapshot(){return {main:S.main,projects:S.projects}}
async function api(action,opts={}){const r=await fetch("api.php?action="+action,{cache:"no-store",...opts,headers:{"Content-Type":"application/json","X-Key":getKey(),...(opts.headers||{})}});let j=null;try{j=await r.json()}catch(_){}return {status:r.status,j}}
async function loadStandalone(){
  try{const r=await fetch("api.php?action=ping",{cache:"no-store"});if(r.ok){const j=await r.json();if(j&&j.app==="scenedrome-cashflow"){mode="server";return loadServer(j)}}}catch(_){}
  mode="local";return loadLocal();
}
function keyScreen(msg){document.getElementById("top").innerHTML="";document.getElementById("nav").innerHTML="";renderBrand();setSave("err","Locked");
  document.getElementById("view").innerHTML=`<div class="empty"><h2>Enter access key</h2><p>${esc(msg||"These books are on your SCENEDROME server. Type the access key set in api.php.")}</p>
   <div style="display:flex;gap:8px;max-width:360px;margin:0 auto"><input class="in" id="keyIn" type="password" autocomplete="current-password" placeholder="Access key" style="background:var(--field);border-color:var(--line);font-size:16px"><button class="btn pri" data-act="setKey">Open</button></div></div>`;
  setTimeout(()=>{const k=document.getElementById("keyIn");if(k)k.focus()},50)}
async function loadServer(ping){
  if(ping&&ping.configured===false){keyScreen("The server file isn't set up yet: open api.php on the NAS and replace CHANGE-ME with your own access key.");return}
  if(!getKey()){keyScreen();return}
  let res;try{res=await api("load")}catch(_){setSave("err","Server unreachable");emptyState("Can't reach the server","Check that the NAS is on and you're on the same network or VPN, then open the page again.");return}
  if(res.status===401){keyScreen("That key didn't work. Try again.");return}
  if(res.status!==200||!res.j){setSave("err","Server error");emptyState("The server answered with an error",(res.j&&res.j.error)||"Check the data folder permissions on the NAS.");return}
  srv.ver=res.j.version||0;canWrite=true;
  if(!res.j.data){emptyState("No books on the server yet",seedData()?"This file has your books built in. Load them onto the server, or start blank.":"Create blank books, or restore a backup downloaded from the Claude version.",true);setSave("ok","Connected to server");startPoll();return}
  let sd2;try{sd2=await openObj(res.j.data)}catch(_){cryptoFail();return}applyData(sd2);setSave("ok","Saved on server");if(ui.migrated||!isSealed(res.j.data)){ui.migrated=false;markDirty("main")}startPoll();route();
}
function startPoll(){clearInterval(srv.poll);srv.poll=setInterval(async()=>{if(document.hidden||dirty.size||flushing)return;try{const r=await api("version");if(r.status===200&&r.j&&r.j.version>srv.ver){const l=await api("load");if(l.status===200&&l.j&&l.j.data&&!dirty.size){try{const dd=await openObj(l.j.data);srv.ver=l.j.version;applyData(dd);scheduleRender();toast("Updated with changes from another device")}catch(_){}}}}catch(_){}},12000)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&mode==="server"&&srv.poll){clearInterval(srv.poll);startPoll();api("version").then(async r=>{if(r.status===200&&r.j&&r.j.version>srv.ver&&!dirty.size){const l=await api("load");if(l.j&&l.j.data){try{const dd=await openObj(l.j.data);srv.ver=l.j.version;applyData(dd);scheduleRender()}catch(_){}}}}).catch(()=>{})}});
function seedData(){return SEED_CACHE&&SEED_CACHE.main?SEED_CACHE:null}
function isBlankBooks(o){if(!o||!o.main)return true;const named=(o.main.salaries||[]).some(r=>r.name&&r.name.trim());return !Object.keys(o.projects||{}).length&&!named}
async function loadLocal(){canWrite=true;let o=null,wasPlain=false;try{o=JSON.parse(localStorage.getItem(LOCAL_KEY)||"null")}catch(_){}
  if(o&&isSealed(o)){try{o=await openObj(o)}catch(_){cryptoFail();return}}else if(o)wasPlain=true;
  const sd=seedData();if(sd&&isBlankBooks(o)){o=sd;ui.migrated=true}
  if(!o||!o.main){emptyState("Welcome","This copy saves on this device. Create blank books, or restore the backup you downloaded from the Claude version.",true);setSave("ok","Saved on this device");return}
  applyData(o);setSave("ok","Saved on this device (encrypted)");if(ui.migrated||wasPlain){ui.migrated=false;markDirty("main")}route()}
async function load(){
  if(!(window.claude&&typeof window.claude.use==="function"))return loadStandalone();
  let timer;const timeout=new Promise(r=>timer=setTimeout(()=>r("timeout"),10000));
  db=await Promise.race([window.claude?.use?.("db")??Promise.resolve(null),timeout]);
  if(db==="timeout")db=null;
  if(!db){clearTimeout(timer);return loadStandalone()}
  try{
    const res=await Promise.race([Promise.all([db.doc("books/main").get(),db.collection("projects").get()]),timeout]);
    clearTimeout(timer);
    if(res==="timeout"){setSave("err","Can't reach saved data yet");emptyState("Your books can't be reached right now","Check your connection and open the page again.");return}
    const [mainSnap,projSnap]=res;
    let plain=false;
    try{for(const d of projSnap.docs){const raw=d.data();if(!raw)continue;if(!isSealed(raw))plain=true;const p=await openObj(raw);S.projects[d.id]=normProject(JSON.parse(JSON.stringify(p)));remoteIds.add(d.id)}}catch(_){cryptoFail();return}
    if(!mainSnap.exists){emptyState("No books yet","Start a fresh set of books with 15 salary slots, office rent, an expenses log and 15 subscription slots.",true);setSave("ok","Ready");return}
    let mraw=mainSnap.data();if(!isSealed(mraw))plain=true;try{mraw=await openObj(mraw)}catch(_){cryptoFail();return}
    S.main=normMain(JSON.parse(JSON.stringify(mraw)));if(plain&&canWrite)setTimeout(()=>{markAll();toast("Your saved books are now encrypted with the password")},300);
    for(const id of Object.keys(S.projects))if(!S.main.order.includes(id))S.main.order.push(id);
    setSave("ok","All changes saved");
    if(ui.migrated&&canWrite){ui.migrated=false;markDirty("main")}
    liveSync();
  }catch(e){setSave("err","Couldn't load saved data");emptyState("Couldn't load your books","Open the page again in a moment.");return}
  route();
}
function canon(o){return JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v)}
function liveSync(){
  try{
    db.doc("books/main").onSnapshot(async snap=>{if(snap.metadata.hasPendingWrites||dirty.has("main")||flushing||!snap.exists)return;let d;try{d=await openObj(snap.data())}catch(_){return}if(dirty.has("main")||flushing)return;const nx=JSON.stringify(d);if(canon(S.main)===canon(d))return;
      S.main=normMain(JSON.parse(nx));for(const id of Object.keys(S.projects))if(!S.main.order.includes(id))S.main.order.push(id);scheduleRender()},()=>{});
    db.collection("projects").onSnapshot(async qs=>{if(qs.metadata.hasPendingWrites||flushing)return;let ch=false;
      for(const c of qs.docChanges()){const id=c.doc.id;if(dirty.has("p:"+id))continue;
        if(c.type==="removed"){if(S.projects[id]){delete S.projects[id];S.main.order=S.main.order.filter(x=>x!==id);ch=true}remoteIds.delete(id);continue}
        let d=c.doc.data();if(!d)continue;try{d=await openObj(d)}catch(_){continue}if(S.projects[id]&&canon(S.projects[id])===canon(d))continue;
        S.projects[id]=normProject(JSON.parse(JSON.stringify(d)));remoteIds.add(id);if(!S.main.order.includes(id))S.main.order.push(id);ch=true}
      if(ch)scheduleRender()},()=>{});
  }catch(_){}
}

function isoOk(y,m,d){if(y<1900||y>2100||m<1||m>12||d<1)return null;const last=new Date(y,m,0).getDate();if(d>last)return null;return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function parseDate(v){v=String(v).trim();if(!v)return "";{const t=v.match(/^(\d{1,2})[\s\-\/.]*([A-Za-z]{3,})[\s\-\/.,]*(\d{2,4})?$/);if(t){const mi=MONTHS.findIndex(x=>t[2].toLowerCase().startsWith(x.toLowerCase()));if(mi<0)return null;let y=t[3]?+t[3]:num(S.main.settings.year)||new Date().getFullYear();if(t[3]&&t[3].length<=2)y+=y>60?1900:2000;return isoOk(y,mi+1,+t[1])}}let m=v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);if(m)return isoOk(+m[1],+m[2],+m[3]);

const RATE_K=[["quality","Quality of work"],["speed","Speed & deadlines"],["reliability","Reliability"],["communication","Communication"]];
const DEF_NOTE_TAGS=["Work","Feedback","Payment","Warning","Other"];
/* salary history: [{from:"YYYY-MM",amount,note}] — a salary applies from its month until the next change */
function curYM(){const d=new Date();return mkey(d.getFullYear(),d.getMonth()+1)}
function refYM(Y){const d=new Date();return Y===d.getFullYear()?curYM():Y<d.getFullYear()?mkey(Y,12):mkey(Y,1)}
function salHist(r){if(!Array.isArray(r.salHist))r.salHist=[];r.salHist.sort((a,b)=>String(a.from).localeCompare(String(b.from)));return r.salHist}
function salaryAt(r,ym){let v=0;for(const h of salHist(r))if(String(h.from)<=ym)v=num(h.amount);return v}
function salaryChangesIn(r,Y){return salHist(r).filter(h=>String(h.from).startsWith(Y+"-")&&h.from!==Y+"-01")}
function setYearSalary(r,Y,amt){const H=salHist(r);const k=Y+"-01";const e=H.find(h=>h.from===k);
  if(e)e.amount=amt;else if(salaryAt(r,k)!==amt)H.push({id:uid(),from:k,amount:amt,note:""});salHist(r);r.monthly=salaryAt(r,curYM())}
/* salary due for one month: nothing before the start date, the start month pro-rated by days worked */
function salaryDue(r,Y,m){{const k=mkey(Y,m);if(r.paid&&k in r.paid&&num(r.paid[k])===0)return 0;if(!r.active)return r.paid&&num(r.paid[k])>0?salaryAt(r,k):0}const full=salaryAt(r,mkey(Y,m));if(!full)return 0;
  if(r.start){const sy=yearOf(r.start),sm=monthOf(r.start),sd=+String(r.start).slice(8,10)||1;
    if(Y<sy||(Y===sy&&m<sm))return 0;
    if(Y===sy&&m===sm){const dim=new Date(Y,m,0).getDate();return Math.round(full*(dim-sd+1)/dim)}}
  return full}
function beforeStart(r,Y,m){if(!r.start)return false;const sy=yearOf(r.start),sm=monthOf(r.start);return Y<sy||(Y===sy&&m<sm)}
function parseYM(raw){raw=String(raw).trim();const m1=raw.match(/^([A-Za-z]{3,})\s*[-\/ ]?\s*(\d{4})$/),m2=raw.match(/^(\d{1,2})\s*[-\/.]\s*(\d{4})$/);
  if(m1){const mi=MONTHS.findIndex(x=>m1[1].toLowerCase().startsWith(x.toLowerCase()));return mi>=0?mkey(+m1[2],mi+1):null}if(m2&&+m2[1]>=1&&+m2[1]<=12)return mkey(+m2[2],+m2[1]);return null}
function syncSub(sb){const e=planAt(sb,curYM())||planHist(sb)[planHist(sb).length-1];sb.price=e?num(e.price):0;sb.account=e?e.plan||"":sb.account}
function adjSum(r,Y){let bonus=0,ded=0;for(const a of r.adj||[]){if(Y&&yearOf(a.date)!==Y)continue;if(a.type==="Deduction")ded+=num(a.amount);else bonus+=num(a.amount)}return {bonus,ded,net:bonus-ded}}
const BUILTIN_TABS=[["overview","Overview"],["cashflow","Cash flow"],["salaries","Salaries"],["rent","Office rent"],["expenses","Expenses"],["assets","Assets"],["subscriptions","Subscriptions"],["team","Team profiles"]];
function tabCfg(){const s=S.main.settings;s.tabs=s.tabs||{};return s.tabs}
function tabLabel(id,def){const t=tabCfg()[id];return (t&&t.label&&t.label.trim())||def||(BUILTIN_TABS.find(x=>x[0]===id)||[])[1]||id}
function tabHidden(id){const t=tabCfg()[id];return !!(t&&t.hidden)}
function tabOrder(){const ids=[...BUILTIN_TABS.map(x=>x[0]),...(S.main.custom||[]).map(c=>"c-"+c.id)];const cfg=tabCfg();
  return ids.map((id,i)=>({id,o:cfg[id]&&cfg[id].order!=null?cfg[id].order:i})).sort((a,b)=>a.o-b.o).map(x=>x.id)}
function customById(id){return (S.main.custom||[]).find(c=>c.id===id)}
function members(){return S.main.salaries.filter(r=>r.name&&r.name.trim())}
function memberById(id){return S.main.salaries.find(r=>r.id===id)}
function avgRating(r){const v=RATE_K.map(([k])=>num(r.rating&&r.rating[k])).filter(Boolean);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0}
function starsH(n){n=Math.round(n*2)/2;let h="";for(let i=1;i<=5;i++)h+=`<i class="${n>=i?"f":n>=i-.5?"h":""}">★</i>`;return `<span class="stars" aria-label="${n} out of 5">${h}</span>`}
function memberStats(r,Y){
  let salY=0,salAll=0;for(const k in r.paid){const v=num(r.paid[k]);salAll+=v;if(k.startsWith(Y+"-"))salY+=v}
  let agreed=0,paidP=0,paidPY=0;const work=[],pays=[];
  for(const k in r.paid){const v=num(r.paid[k]);if(v&&k.startsWith(Y+"-"))pays.push({date:k+"-01",src:"Salary · "+MONTHS[+k.slice(5,7)-1]+" "+k.slice(0,4),amt:v})}
  for(const a of r.adj||[]){const v=num(a.amount);if(v&&yearOf(a.date)===Y)pays.push({date:a.date,src:a.type+(a.reason?" · "+a.reason:""),amt:a.type==="Deduction"?-v:v})}
  const ajY=adjSum(r,Y),ajAll=adjSum(r,null);
  for(const p of projList()){const lines=p.costs.filter(l=>l.memberId===r.id);const man=(p.team||[]).filter(t=>t.memberId===r.id);if(!lines.length&&!man.length)continue;
    let a=0,pd=0;for(const l of lines){const sp=projLine(p,l,"cost",Y);a+=sp.exp;pd+=sp.paid;for(const x of l.payments){const v=payEGP(x,l.rate);if(yearOf(x.date)!==Y)continue;paidPY+=v;pays.push({date:x.date,src:p.name+(l.role?" · "+l.role:""),amt:v,pid:p.id})}}
    if(!a&&!pd&&lines.length&&!projInYear(p,Y))continue;
    agreed+=a;paidP+=pd;work.push({p,roles:[...new Set([...lines.map(l=>l.role||l.name),...man.map(t=>t.role)].filter(Boolean))],agreed:a,paid:pd,linked:lines.length})}
  pays.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  return {salY,salAll,agreed,paidP,paidPY,work,pays,ajY,ajAll,totalY:salY+ajY.net+paidPY,totalAll:salAll+ajAll.net+paidP};
}
function unlinkedMatches(r){const n=r.name.trim().toLowerCase();const out=[];if(!n)return out;

function cmpCls(v,due){if(v==null||v===0||!due&&!v)return "";const d=Math.round(v)-Math.round(due||0);return d>0?" over":d<0?" under":""}
function zeroCell(tg,path,map,k,ph,due){const has=map&&k in map,v=has?num(map[k]):null,z=has&&v===0;const c=z?" zero":due!=null&&has?cmpCls(v,due):"";

function vCashflow(){

  }
  const known=true;let bal=before;
  const balances=M.map((m,i)=>{const startM=mkey(Y,i+1)+"-01";if(startM<s.openingDate&&yearOf(s.openingDate)===Y){/* months before opening */}bal+=m.in-m.out;return bal});

  const minV=known?Math.min(0,...balances):0;const sc=v=>pt+ih*(1-(v-minV)/(maxV-minV));

const LOCK={salt:"scenedrome-cashflow-lock-v1",iter:150000,hash:"22c189842b3bcf93dfb3149cffbef8dda68b8691cb5f5386f7f380eeb14cfac7"};
let SEED_CACHE=null;
const enc=new TextEncoder();
function b64(u8){let s="";u8.forEach(c=>s+=String.fromCharCode(c));return btoa(s)}

async function decryptSeed(pw){const el=document.getElementById("seed-data");if(!el||!el.textContent.trim())return;let o;try{o=JSON.parse(el.textContent)}catch(_){return}
  if(!o.enc){SEED_CACHE=o;return}
  if(o.dk&&DATA_KEY){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},DATA_KEY,unb64(o.enc));SEED_CACHE=JSON.parse(new TextDecoder().decode(pt));return}
  const kb=await pbkdf2(pw,unb64(o.salt),o.iter,256);const key=await crypto.subtle.importKey("raw",kb,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},key,unb64(o.enc));SEED_CACHE=JSON.parse(new TextDecoder().decode(pt))}

  L.innerHTML=`<form class="lockbox" autocomplete="on"><img src="assets/logo.png" alt="SCENEDROME Studios" class="lklogo"><h2>Cashflow is locked</h2><p>${esc(msg||"Enter the password to open the books.")}</p>
   <div class="pwrow"><input type="password" id="lockPw" class="in" placeholder="Password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Password"><button type="button" class="pweye" id="pwEye" aria-label="Show password">Show</button></div>
   <button class="btn pri" type="submit">Unlock</button><div class="lksig">${SIG_HTML}</div></form>`;
  const f=L.querySelector("form");f.addEventListener("submit",async ev=>{ev.preventDefault();const pw=document.getElementById("lockPw").value.trim();if(!window.crypto||!crypto.subtle){f.querySelector("p").textContent="This view blocks the password check. Open the file in Safari or Chrome directly, or open the Claude link in a browser.";return}const btn=f.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Checking…";
    try{const h=hex(await pbkdf2(pw,LOCK.salt,LOCK.iter,256));if(h!==LOCK.hash){btn.disabled=false;btn.textContent="Unlock";f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");f.querySelector("p").textContent="That password isn't right. Try again.";return}
      const kb=await pbkdf2(pw,"scenedrome-cashflow-data-v1",LOCK.iter,256);DATA_KEY=await crypto.subtle.importKey("raw",kb,"AES-GCM",true,["encrypt","decrypt"]);
