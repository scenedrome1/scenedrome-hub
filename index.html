<!DOCTYPE html>
<html lang="en">
<head>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("sd-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SCENEDROME">
<meta name="application-name" content="SCENEDROME Hub">
<meta name="theme-color" content="#03100c">
<title>SCENEDROME Hub</title>
<link rel="icon" id="brandIcon" href="assets/s.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link id="brandFonts" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#03100c;--panel:rgba(8,28,23,.88);--panel2:#0d2a23;--field:#06180f;--line:#173c33;--line2:#24524a;--text:#eef3ef;--muted:#9fb9b0;--faint:#5f7f75;
--gold:#d6a03d;--gold2:#f0c46a;--grad:linear-gradient(90deg,#f0c46a,#d6a03d 60%,#a8741f);--ok:#5fd3a8;--bad:#ef7d6c;--warn:#f0c46a;--info:#6cc3e0;--lilac:#b9a6e8;
--bgimg:url("assets/bg.jpg");--markimg:url("assets/s.png");--display:"Montserrat","Helvetica Neue",Arial,sans-serif;--body:"Poppins","Helvetica Neue",Arial,sans-serif;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg) var(--bgimg) center top/cover fixed no-repeat;color:var(--text);font:400 13.5px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-transform:uppercase;letter-spacing:.01em}
h1{font-weight:800;font-size:24px;line-height:1.1}h2{font-weight:700;font-size:17px}h3{font-weight:700;font-size:14px;letter-spacing:.04em}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:9px;padding:9px 12px;width:100%;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
select option{background:var(--panel)}
textarea{resize:vertical}
label{display:block;font:400 10.5px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
label>input,label>select,label>textarea{margin-top:6px;letter-spacing:normal;text-transform:none;font-size:13.5px;color:var(--text)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.tiny{font-size:12px}.grow{flex:1;min-width:0}.right{margin-left:auto}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:10px}.wrap{flex-wrap:wrap}
.eyebrow{font:400 10.5px var(--body);letter-spacing:.3em;text-transform:uppercase;color:var(--faint)}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel2);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;white-space:nowrap;transition:transform .15s,border .2s}
.btn:hover{border-color:var(--gold)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);border:0;color:#1a1204;font-weight:600;box-shadow:0 8px 22px -12px rgba(240,196,106,.8)}
.btn.ghost{background:transparent}.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}.btn.wide{width:100%}
.btn.ok{background:rgba(95,211,168,.12);border-color:rgba(95,211,168,.35);color:var(--ok)}
.btn[disabled]{opacity:.4;pointer-events:none}
.iconbtn{width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--panel2);cursor:pointer;position:relative;flex:none}
.iconbtn:hover{border-color:var(--gold)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:500;background:var(--line);color:var(--muted);white-space:nowrap}
.chip.gold{background:#2a2210;color:var(--gold2)}.chip.ok{background:rgba(95,211,168,.13);color:var(--ok)}.chip.warn{background:rgba(240,196,106,.13);color:var(--warn)}.chip.bad{background:rgba(239,125,108,.14);color:var(--bad)}.chip.info{background:rgba(108,195,224,.13);color:var(--info)}.chip.lilac{background:rgba(185,166,232,.14);color:var(--lilac)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;backdrop-filter:blur(6px)}
.card h3{margin-bottom:12px}
.card.hover{transition:transform .2s,border .2s;cursor:pointer}.card.hover:hover{transform:translateY(-2px);border-color:var(--line2)}
.card.hero{background:linear-gradient(135deg,rgba(214,160,61,.18),var(--panel) 62%);border-color:#5a4520;position:relative;overflow:hidden}
.card.hero::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.span2{grid-column:span 2}
.kpi .l{font:400 10.5px var(--body);letter-spacing:.26em;text-transform:uppercase;color:var(--faint)}
.kpi .v{font:700 22px/1.2 var(--display);margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.bar{height:7px;background:var(--panel);border:1px solid var(--line);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.green>i{background:linear-gradient(90deg,#2a9c78,var(--ok))}
.av{border-radius:50%;display:inline-grid;place-items:center;font:700 13px var(--display);color:#fff;flex:none;background-size:cover;background-position:center;border:2px solid var(--bg)}
.stack{display:flex}.stack .av{margin-left:-8px}.stack .av:first-child{margin-left:0}
.list>.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.list>.item:first-child{border-top:0;padding-top:0}
.item.click{cursor:pointer}.item.click:hover b{color:var(--gold2)}
.sec-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sec-title .num{width:26px;height:26px;border-radius:7px;background:var(--honey-bg);color:var(--gold2);display:grid;place-items:center;font:700 13px var(--display)}
.empty{padding:26px;text-align:center;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{font:500 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;background:var(--card2);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
td input,td select{padding:5px 8px;font-size:12.5px}
.tablewrap{overflow-x:auto}
.num{font-variant-numeric:tabular-nums}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.login-art{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:52px;background:rgba(1,8,6,.35)}
.login-art img.logo{width:min(420px,80%)}
.login-art .big{font:800 clamp(30px,4.2vw,54px)/1.04 var(--display);text-transform:uppercase;letter-spacing:-.01em}
.login-art .big em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.login-art p{color:var(--muted);max-width:440px}
.login-side{display:grid;place-items:center;padding:32px;background:rgba(3,16,12,.72);border-left:1px solid var(--line)}
.login-card{width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
.demo-box{margin-top:6px;padding:14px;border:1px dashed var(--line2);border-radius:12px}
.demo-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.demo-chip{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:11.5px;transition:border .2s}
.demo-chip:hover{border-color:var(--gold)}
/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:rgba(2,12,9,.86);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:10;backdrop-filter:blur(8px)}
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--line)}
.brand img{width:100%;max-width:180px;max-height:70px;object-fit:contain;object-position:left;display:block}.brand .sub{font:300 10.5px var(--body);letter-spacing:.42em;text-transform:uppercase;color:var(--faint);margin-top:8px}
.nav{flex:1;overflow:auto;padding:10px 10px 16px}
.nav h6{font:400 10px var(--body);letter-spacing:.32em;text-transform:uppercase;color:var(--faint);margin:14px 10px 6px}
.nav a{display:flex;gap:11px;align-items:center;padding:8px 11px;border-radius:9px;color:var(--muted);cursor:pointer;text-decoration:none;position:relative;border:1px solid transparent}
.nav a:hover{color:var(--text);background:rgba(15,54,44,.6)}.nav a.on{background:linear-gradient(90deg,rgba(214,160,61,.16),transparent);color:var(--text);border-color:#3b2f17}.nav a.on svg{color:var(--gold2)}
.side-foot{margin:10px;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.side-foot:hover{border-color:var(--gold)}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(3,16,12,.88);backdrop-filter:blur(12px);z-index:8}
.top h2{font:800 20px var(--display)}
.viewas{display:flex;align-items:center;gap:8px}.viewas select{width:auto;padding:6px 10px;font-size:12px;max-width:260px}
.content{padding:22px 26px 90px;max-width:1320px}
.content>*{animation:rise .4s both}.content>*:nth-child(2){animation-delay:.04s}.content>*:nth-child(3){animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.hello{display:flex;align-items:center;gap:18px;padding:20px 22px;border-radius:16px;background:linear-gradient(135deg,rgba(214,160,61,.16),var(--panel) 55%);border:1px solid #3b2f17;margin-bottom:16px;position:relative;overflow:hidden}
.hello::after{content:"";position:absolute;right:-30px;bottom:-40px;width:170px;height:200px;background:var(--markimg) center/contain no-repeat;opacity:.07}
.hello h1{font-size:22px}
.bellwrap{position:relative}
.bellpanel{position:absolute;right:0;top:46px;width:360px;max-height:460px;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.6);display:none;z-index:30}
.bellpanel.open{display:block;animation:rise .2s}
.bellpanel .n{display:flex;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}.bellpanel .n:hover{background:#0f362c}.bellpanel .n.unread{background:rgba(214,160,61,.07)}
.badge{position:absolute;top:-5px;right:-5px;background:var(--gold);color:#1a1204;font-size:10px;font-weight:700;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0;overflow-x:auto}
.tabs a{padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font:500 12px var(--body);letter-spacing:.14em;text-transform:uppercase}
.tabs a.on{color:var(--text);border-color:var(--gold)}
.seg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg a{padding:5px 12px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--muted)}.seg a.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px #3b2f17}
.phead{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.stages{display:flex;gap:3px;margin-top:6px}.stages .st{flex:1;text-align:center;min-width:0}
.stages .st i{display:block;height:6px;border-radius:99px;background:var(--line);margin-bottom:6px}.stages .st.done i{background:var(--ok)}.stages .st.cur i{background:var(--grad);box-shadow:0 0 12px rgba(240,196,106,.55)}
.stages .st span{font-size:10px;color:var(--faint);line-height:1.2;display:block;overflow:hidden;text-overflow:ellipsis}.stages .st.cur span{color:var(--gold2);font-weight:500}.stages .st.done span{color:var(--muted)}
/* chat */
.chat{display:flex;flex-direction:column;height:min(640px,calc(100vh - 300px));min-height:420px;padding:0;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}
.chat-scroll{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;max-width:78%;animation:rise .25s both}.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .meta{font-size:11px;color:var(--faint);margin-bottom:3px}.msg.me .meta{text-align:right}
.bubble{background:var(--hover);border:1px solid var(--line);padding:9px 14px;border-radius:16px 16px 16px 5px;white-space:pre-wrap;word-wrap:break-word}
.msg.me .bubble{background:var(--grad);border:0;color:#1a1204;border-radius:16px 16px 5px 16px}
.bubble .mention{font-weight:600;color:var(--gold2)}.msg.me .bubble .mention{color:#4a2f00}
.att{display:flex;flex-direction:column;gap:6px;margin-top:6px}.att img{max-width:260px;max-height:200px;border-radius:12px;display:block;object-fit:cover}
.att .file{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.25);font-size:12px}
.reacts{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}.msg.me .reacts{justify-content:flex-end}
.reacts span{font-size:12px;padding:1px 7px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}.reacts span.mine{border-color:var(--gold)}
.reacts .add{opacity:0;transition:opacity .2s}.msg:hover .reacts .add{opacity:1}
.daydiv{align-self:center;font-size:11px;color:var(--faint);background:var(--field);border:1px solid var(--line);padding:2px 10px;border-radius:99px}
.composer{display:flex;gap:8px;align-items:flex-end;padding:12px;border-top:1px solid var(--line);background:var(--panel)}
.composer textarea{min-height:42px;max-height:140px;border-radius:12px}
.pend{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px}.pend:empty{display:none}.pend>div{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:4px 8px;font-size:12px;margin-top:8px}
.pend img{width:28px;height:28px;object-fit:cover;border-radius:6px}
.rules{font-size:11px;color:var(--faint);padding:6px 14px 10px;background:var(--panel)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto}
.kanban.k5{grid-template-columns:repeat(5,minmax(200px,1fr))}
.kcol{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:180px}
.kcol h4{font:400 10.5px var(--body);letter-spacing:.24em;color:var(--faint);padding:4px 6px 10px;display:flex;justify-content:space-between}
.kcard{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:8px;cursor:pointer;transition:transform .15s,border .2s}
.kcard:hover{border-color:var(--line2);transform:translateY(-1px)}.kcard.mine{border-left:3px solid var(--gold)}
.kcard .t{font-weight:500;margin-bottom:8px}
.ep{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel);overflow:hidden}
.ep-row{display:grid;grid-template-columns:58px 160px 1fr 48px 110px 110px 20px;align-items:center;gap:12px;padding:11px 14px;cursor:pointer}
.ep-row:hover,.ep.open .ep-row{background:var(--hover)}
.ep-body{padding:14px;border-top:1px solid var(--line)}
.sec{border:1px solid var(--line);border-radius:10px;margin-top:10px;background:var(--panel)}
.sec>.sh{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-radius:10px}.sec>.sh:hover{background:var(--hover)}
.sec>.sb{padding:12px;border-top:1px solid var(--line)}
.sub{background:rgba(3,16,12,.6);border:1px solid var(--line);border-radius:10px;padding:12px;margin:6px 0}
.chk{display:inline-flex;width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--faint)}
.chk.on{background:rgba(95,211,168,.15);border-color:rgba(95,211,168,.55);color:var(--ok)}
.tgl{opacity:.5}.tgl.on{opacity:1}
.mini input,.mini select,.mini textarea{padding:7px 10px;font-size:13px}
.shot{display:grid;grid-template-columns:60px 1fr 80px 170px 125px auto 16px;gap:8px;align-items:center}.shot input,.shot select{padding:5px 8px;font-size:12.5px}
@media(max-width:760px){.shot{grid-template-columns:1fr 1fr}}
@media print{body{background:#fff!important}#cfLayer,.side,.sidebar,nav,.topbar,.tabs,.btn,.chk{display:none!important}}
.dropzone{border:1.5px dashed var(--line2);border-radius:12px;padding:22px;text-align:center;transition:border .2s,background .2s;cursor:pointer;display:block;letter-spacing:normal;text-transform:none;font-size:13px;color:var(--text)}
.dropzone.over,.dropzone:hover{border-color:var(--gold);background:rgba(214,160,61,.06)}
.filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fcard .thumb{height:120px;background:var(--field) center/cover;display:grid;place-items:center;color:var(--faint)}.fcard .b{padding:10px 12px}
.cover{height:150px;position:relative}
.pcard{overflow:hidden;padding:0}.pinfo{padding:0 22px 22px;margin-top:-46px;position:relative}
.covers{display:flex;gap:8px}.covers a{width:34px;height:22px;border-radius:6px;cursor:pointer;border:2px solid transparent}.covers a.on{border-color:var(--gold2)}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;margin:0 6px 6px 0}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--faint)}
.kv{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr);gap:7px 12px;font-size:13px;margin:0}.kv dt{color:var(--faint)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.switch{width:36px;height:20px;border-radius:99px;background:var(--line);border:1px solid var(--line2);position:relative;cursor:pointer;display:inline-block;transition:background .2s;vertical-align:middle;flex:none}
.switch::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s,background .2s}
.switch.on{background:var(--gold);border-color:var(--gold)}.switch.on::after{left:18px;background:var(--gold2)}.switch.fixed{opacity:.45;cursor:not-allowed}
.permgroup{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:rgba(4,22,17,.6)}
.permgroup h4{font:400 10.5px var(--body);letter-spacing:.26em;color:var(--gold2);margin-bottom:8px}
.perm{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}.perm:first-of-type{border-top:0}
.perm .d{font-size:12.5px}.perm .def{font-size:10.5px;color:var(--faint)}
.tier{padding:18px;border-radius:14px;background:linear-gradient(135deg,#2a2210,#0a1a12);border:1px solid #5a4520}
.offer{padding:18px;border-radius:14px;border:1px solid var(--line2);background:linear-gradient(135deg,rgba(214,160,61,.14),var(--panel))}
.steps{display:flex;flex-direction:column;gap:0}.steps .s{display:grid;grid-template-columns:26px 150px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}.steps .s:first-child{border-top:0}
.steps .n{width:22px;height:22px;border-radius:6px;background:var(--honey-bg);color:var(--gold2);display:grid;place-items:center;font:700 11px var(--display)}

/* ===== Design revision 02 ¬∑ Light / Dark / Mixed ===== */
:root,html[data-theme]{--gold:#DE9D1A;--forest:#0A231D;
 --blue-bg:#DCEAF7;--blue-fg:#1F4C70;--mint-bg:#D8EDDE;--mint-fg:#20573A;--honey-bg:#F8E6B8;--honey-fg:#63460F;--coral-bg:#F7DCD6;--coral-fg:#783C34;--lav-bg:#E9E2F7;--lav-fg:#57407A;--r:12px}
html[data-theme=light],html[data-theme=mixed]{--bg:#E8DDCD;--panel:#FBF8F2;--panel2:#F1E9DB;--card2:#F1E9DB;--field:#FFFDF9;--line:#D9CDB8;--line2:#C9BBA1;--text:#12392E;--muted:#496458;--faint:#6f8479;--hover:#EFE6D6;--sel:#E3EFE6;
 --gold2:#9A6608;--ok:#20573A;--bad:#783C34;--warn:#63460F;--info:#1F4C70;--lilac:#57407A;--rail:#E2ECE5;--railtext:#2E5246;--railon:#C9DECF;--railontext:#0A231D;--railline:#CFDDD3;--shadow:0 1px 2px rgba(18,57,46,.05),0 6px 20px -12px rgba(18,57,46,.18);color-scheme:light}
html[data-theme=mixed]{--rail:#0A231D;--railtext:#BCD2C6;--railon:#1A3D31;--railontext:#FFFFFF;--railline:#1E3B31}
html[data-theme=dark]{--bg:#030806;--panel:#0B1A14;--panel2:#08130E;--card2:#08130E;--field:#050E0A;--line:#1C3B2E;--line2:#2B5646;--text:#F4F7F0;--muted:#B8D1C2;--faint:#86A595;--hover:#12291F;--sel:#163A2B;
 --gold2:#F2C15A;--ok:#C0EACE;--bad:#F6CBC2;--warn:#F9DEA3;--info:#B9E3FF;--lilac:#DED0F6;--rail:#020504;--railtext:#BCD2C6;--railon:#14382A;--railontext:#FFFFFF;--railline:#12281F;--shadow:0 1px 2px rgba(0,0,0,.5);color-scheme:dark;
 --blue-bg:#193E51;--blue-fg:#B9E3FF;--mint-bg:#234834;--mint-fg:#C0EACE;--honey-bg:#4E3C19;--honey-fg:#F9DEA3;--coral-bg:#51322D;--coral-fg:#F6CBC2;--lav-bg:#3D3251;--lav-fg:#DED0F6}
html[data-theme] body{background:var(--bg)!important;background-image:none!important;color:var(--text);font:400 14px/1.5 var(--body);letter-spacing:0}
html[data-theme] h1,html[data-theme] h2,html[data-theme] h3,html[data-theme] h4{text-transform:none;letter-spacing:-.005em;font-weight:500;color:var(--text)}
html[data-theme] h1{font-size:28px;line-height:1.2}html[data-theme] h2{font-size:20px;line-height:1.3}html[data-theme] h3{font-size:16px;letter-spacing:0}
html[data-theme] .eyebrow{letter-spacing:.08em;font-size:11px;font-weight:500;color:var(--muted)}
html[data-theme] label{letter-spacing:0;text-transform:none;font:500 12.5px var(--body);color:var(--muted)}
html[data-theme] label>input,html[data-theme] label>select,html[data-theme] label>textarea{font-size:14px}
html[data-theme] input,html[data-theme] select,html[data-theme] textarea{background:var(--field);border:1px solid var(--line2);border-radius:8px;color:var(--text)}
html[data-theme] input:focus,html[data-theme] select:focus,html[data-theme] textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
html[data-theme] select option{background:var(--panel);color:var(--text)}
html[data-theme] :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
html[data-theme] .muted{color:var(--muted)}html[data-theme] .faint{color:var(--faint)}
/* shell */
html[data-theme] .shell{grid-template-columns:232px minmax(0,1fr)}
html[data-theme] .side{background:var(--rail)!important;border-right:1px solid var(--railline);backdrop-filter:none;color:var(--railtext)}
html[data-theme] .brand{border-bottom:1px solid var(--railline);padding:22px 18px 16px}
html[data-theme] .brand img{max-width:150px;display:block}
html[data-theme] .brand .sub{color:var(--railtext);opacity:.75;letter-spacing:.32em}
html[data-theme] .brand .mk{display:none;align-items:center;gap:10px;font:500 16px var(--display);color:var(--railontext)}
html[data-theme] .brand .mk i{width:34px;height:34px;border-radius:9px;background:var(--forest) var(--markimg) center/62% no-repeat;display:block}

html[data-theme] .nav a{color:var(--railtext);border:0;border-radius:8px;padding:9px 12px;font-size:14px}
html[data-theme] .nav a:hover{background:color-mix(in srgb,var(--railon) 55%,transparent);color:var(--railontext)}
html[data-theme] .nav a.on{background:var(--railon);color:var(--railontext);font-weight:500;border:0}
html[data-theme] .nav h6{color:var(--railtext);opacity:.6;letter-spacing:.14em;font-size:10px}
html[data-theme] .side-foot{background:transparent;border:0;border-top:1px solid var(--railline);border-radius:0;margin:0 10px;padding:14px 6px;color:var(--railontext)}
html[data-theme] .side-foot .faint{color:var(--railtext)!important;opacity:.8}
html[data-theme] .top{background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line);padding:16px 32px 14px;backdrop-filter:blur(10px)}
html[data-theme] .top h2{font-size:26px;font-weight:500;line-height:1.2;margin-top:2px;text-transform:none}
html[data-theme] .top .eyebrow{display:none}
html[data-theme] .crumb{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme] .crumb a{text-decoration:none;cursor:pointer}html[data-theme] .crumb a:hover{color:var(--text)}
html[data-theme] .content{padding:24px 32px 96px;max-width:1360px}
html[data-theme] .iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px}
html[data-theme] .iconbtn:hover{border-color:var(--gold)}
html[data-theme] .badge{background:var(--gold);color:var(--forest);border-color:var(--bg)}
/* buttons */
html[data-theme] .btn{background:var(--panel);border:1px solid var(--line2);color:var(--text);border-radius:8px;font-weight:500}
html[data-theme] .btn:hover{border-color:var(--gold);background:var(--hover)}
html[data-theme] .btn.pri{background:var(--gold);color:var(--forest);border:1px solid var(--gold);box-shadow:none;font-weight:600}
html[data-theme] .btn.pri:hover{background:color-mix(in srgb,var(--gold) 88%,#000)}
html[data-theme] .btn.ghost{background:transparent;border-color:transparent}html[data-theme] .btn.ghost:hover{background:var(--hover);border-color:var(--line)}
html[data-theme] .btn.ok{background:var(--mint-bg);border-color:transparent;color:var(--mint-fg)}
/* cards & lists */
html[data-theme] .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:none;box-shadow:var(--shadow)}
html[data-theme] .card.hover:hover{border-color:var(--line2);transform:translateY(-1px)}
html[data-theme] .card.hero{background:var(--panel);border-color:var(--line)}
html[data-theme] .hello{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
html[data-theme] .list>.item{border-top:1px solid var(--line)}
html[data-theme] .item.click:hover{background:var(--hover)}
html[data-theme] .sec{background:var(--panel);border-color:var(--line)}
html[data-theme] .sec>.sh:hover{background:var(--hover)}
html[data-theme] .ep{background:var(--panel);border-color:var(--line)}
html[data-theme] .ep-row:hover,html[data-theme] .ep.open .ep-row{background:var(--sel)}
html[data-theme] th{background:var(--card2);color:var(--muted);text-transform:none;letter-spacing:0;font-size:12px;font-weight:500;border-bottom:1px solid var(--line)}
html[data-theme] td{border-bottom:1px solid var(--line)}
html[data-theme] .tabs{border-bottom:1px solid var(--line);gap:6px}
html[data-theme] .tabs a{letter-spacing:0;text-transform:none;font-size:14px;color:var(--muted);padding:10px 4px;margin-right:14px;border-bottom:2px solid transparent}
html[data-theme] .tabs a.on{color:var(--text);border-color:var(--gold);font-weight:500}
html[data-theme] .kpi .l{letter-spacing:.06em;font-size:11px;color:var(--muted)}
html[data-theme] .sec-title h2{font-size:20px}
html[data-theme] .empty{color:var(--muted)}
/* chips ‚Üí status pills */
html[data-theme] .chip{background:var(--card2);color:var(--muted);border:1px solid var(--line);font-size:12px;font-weight:500;padding:2px 10px}
html[data-theme] .chip.ok{background:var(--mint-bg);color:var(--mint-fg);border-color:transparent}
html[data-theme] .chip.bad{background:var(--coral-bg);color:var(--coral-fg);border-color:transparent}
html[data-theme] .chip.warn,html[data-theme] .chip.gold{background:var(--honey-bg);color:var(--honey-fg);border-color:transparent}
html[data-theme] .chip.info{background:var(--blue-bg);color:var(--blue-fg);border-color:transparent}
html[data-theme] .chip.lilac{background:var(--lav-bg);color:var(--lav-fg);border-color:transparent}
/* overlays */
html[data-theme] .bellpanel,html[data-theme] .acctpanel{background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 50px -12px rgba(10,35,29,.35)}
html[data-theme] .bellpanel .n{border-top:1px solid var(--line)}html[data-theme] .bellpanel .n.unread{background:color-mix(in srgb,var(--gold) 9%,transparent)}
html[data-theme] .modal-bg{background:rgba(6,24,15,.45)}
html[data-theme] .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 70px -20px rgba(6,24,15,.5)}
/* media keeps a dark surround in every mode */
html[data-theme] video,html[data-theme] .player,html[data-theme] .pvwrap{background:#06180F}
/* common inline dark leftovers */
html[data-theme=light] [style*="var(--line2)"],html[data-theme=mixed] [style*="var(--line2)"]{color:var(--line2)!important}
html[data-theme=light] [style*="rgba(214,160,61,.08)"],html[data-theme=mixed] [style*="rgba(214,160,61,.08)"]{background:color-mix(in srgb,var(--gold) 10%,var(--panel))!important}
html[data-theme=light] [style*="#5a4520"],html[data-theme=mixed] [style*="#5a4520"]{border-color:color-mix(in srgb,var(--gold) 45%,var(--line))!important}
/* account menu */
.acctwrap{position:relative}.acctpanel{position:absolute;right:0;top:46px;width:270px;border-radius:12px;display:none;z-index:31;padding:8px}
.acctpanel.open{display:block}.acctpanel .mi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;text-decoration:none;color:var(--text)}
.acctpanel .mi:hover{background:var(--hover)}.acctpanel .mi.off{opacity:.4;pointer-events:none}.acctpanel hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.seg{display:inline-flex;gap:4px;padding:3px;border-radius:10px;background:var(--card2);border:1px solid var(--line)}
.seg a{padding:6px 14px;border-radius:7px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--muted);text-decoration:none;border:1px solid transparent}
.seg a.on{background:var(--gold);color:var(--forest)}
.seg a:not(.on):hover{background:var(--panel);border-color:var(--line)}
.avbtn{width:38px;height:38px;border-radius:50%;padding:0;overflow:hidden;cursor:pointer;display:inline-grid;place-items:center;border:1px solid var(--line)}
@media (max-width:760px){html[data-theme] .top{padding:12px 14px}html[data-theme] .top h2{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}html[data-theme] .content{padding:16px 14px 110px}
 html[data-theme] .side{border-right:0;border-top:1px solid var(--railline)}html[data-theme] .nav a{font-size:10.5px;padding:7px 6px}
 .top>div:first-child{flex:1;min-width:0}.top .crumb{display:none}}
.today-h{margin:-6px 0 16px;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
.tile{display:flex;flex-direction:column;gap:2px;padding:14px 16px 14px 20px;border-radius:10px;position:relative;text-decoration:none;cursor:pointer;min-width:0}

function genEpisodes(type,count,dist){const r=rng(11);const T=TYPES[type];const last=T.stages.length-1;const locs=['Desert camp','Old souk','Police station','Rooftop','Car ‚Äî night','Villa hall','Hospital corridor','Market alley','Dunes ‚Äî dawn','Office'];
const notes=['Hold on the reaction','Check scarf continuity','Needs sky replacement','Music cue starts here','Trim the walk-in','Dialogue overlap ‚Äî fix in mix','Use take 3','Night grade',''];
return Array.from({length:count},(_,i)=>{const stage=dist(i+1,last,T);const n=24+Math.floor(r()*10);const scenes=[];for(let s=1;s<=n;s++){let st=0;if(stage>=T.lock)st=3;else if(stage>T.edit)st=r()<.85?3:2;else if(stage===T.edit)st=Math.floor(r()*4);
scenes.push({n:s,loc:locs[Math.floor(r()*locs.length)],angles:1+Math.floor(r()*4),note:r()<.4?notes[Math.floor(r()*notes.length)]:'',shot:Math.round(180+r()*420),dur:st?Math.round(55+r()*70):0,st})}
return{n:i+1,stage,target:42*60,scenes}})}

<div class="sec-title"><h2>${u.role==='partner'?'Collabs in progress':'In production'}</h2></div>${act.length?`<div class="grid g3">${act.map(p=>projCard(p)).join('')}</div>`:'<div class="card empty">No active projects</div>'}

const names={overview:'Overview',breakdown:TYPES[p.type].episodic?'Episodes & '+TYPES[p.type].unit.toLowerCase()+'s':'Flow',tasks:u.role==='partner'?'Handoffs':'Tasks',thread:u.role==='partner'?'Collab chat':'Thread',files:'Files & links',drives:'Drives',money:'Deal',report:'Episodes Report',briefs:u.role==='partner'?'Your briefs':'VFX & sound briefs'};const cl=U(p.client),pr=U(p.producer);
return`<div class="card phead">${p.poster?`<img class="pposter" src="${p.poster}" alt="">`:''}${isStaff()&&canManage(p)?`<label class="pposter-up" title="${p.poster?'Change':'Add'} poster / logo">${ic('img',16)}<input type="file" hidden accept="image/*" data-change="posterUp" data-arg="${p.id}"></label>`:''}${ring(projProg(p),66)}<div class="grow"><div class="eyebrow">${esc(TYPES[p.type].label)}${p.genre?' ¬∑ '+esc(p.genre):''} ¬∑ ${esc(p.format)}</div><h1 style="margin:4px 0">${esc(p.name)}</h1><div class="faint tiny">${esc(cl?cl.company:'Internal')} ¬∑ Producer ${esc(pr?pr.name:'‚Äî')} ¬∑ ${p.status==='done'?'Delivered':pDue(p)[0].replace('Due','Final due')}</div></div><span class="chip ${p.status==='done'?'ok':'gold'}">${esc(projStage(p))}</span></div>
<div class="tabs">${tabs.map(t=>`<a class="${V.tab===t?'on':''}" data-act="tab" data-arg="${t}">${names[t]}</a>`).join('')}</div>${TABS[V.tab](p)}`};
const TABS={};
TABS.overview=p=>{const u=me();const ppl=[[p.producer,'Producer'],...p.team.map(i=>[i,(PROJ_ROLES[pRole(p,i)]?PROJ_ROLES[pRole(p,i)]+' ¬∑ ':'')+((U(i)||{}).title||'')])].filter(x=>U(x[0]));const rem=p.quote-p.paid;const showMoney=(u.role==='client'&&p.client===u.id)||finRowsFor().some(r=>r.link===p.id);const row=S.fin.rows.find(r=>r.link===p.id);
const crewEdit=canDo('proj.crew',p)&&(u.role==='owner'||p.producer===u.id||can('proj.all'));
return`<div class="grid g3"><div class="card span2"><h3>Flow</h3>${p.episodes?seriesMini(p):stagesBar(p,p.stage,p.status==='done')}<div style="margin-top:18px"><div class="eyebrow" style="margin-bottom:6px">Brief</div><div>${esc(p.brief)}</div></div>
${projSpecsHTML(p)}</div>
<div class="col"><div class="card"><h3>${u.role==='client'?'Your team':'Crew'}</h3><div class="list">${ppl.map(([i,t])=>{const x=U(i);return`<div class="item click" data-act="profile" data-arg="${x.id}">${av(x,32)}<div class="grow"><b style="font-weight:500">${esc(x.name)}</b><div class="tiny faint">${esc(t)}</div></div>${statusChip(x)}${crewEdit&&i!==p.producer?`<a class="faint" data-act="crewRemove" data-arg="${p.id}|${x.id}" title="Remove from this project" style="cursor:pointer">${ic('x',14)}</a>`:''}</div>`}).join('')}</div>
${(p.partners||[]).length&&u.role!=='client'?`<div class="eyebrow" style="margin:14px 0 6px">Partner studios</div>${p.partners.map(i=>{const x=U(i);if(!x)return'';return`<div class="row" style="cursor:pointer;margin-bottom:6px" data-act="profile" data-arg="${x.id}">${av(x,30)}<div class="grow"><b style="font-weight:500">${esc(x.name)}</b><div class="tiny faint">${esc(x.company)} ¬∑ ${esc(x.title)}</div></div>${crewEdit?`<a class="faint" data-act="crewRemove" data-arg="${p.id}|${x.id}" style="cursor:pointer">${ic('x',14)}</a>`:''}</div>`}).join('')}`:''}
${crewEdit?(()=>{const cand=S.users.filter(x=>!x.suspended&&x.job!=='founder'&&x.role!=='client'&&!p.team.includes(x.id)&&!(p.partners||[]).includes(x.id)&&x.id!==p.producer);return cand.length?`<select data-change="crewAdd" data-arg="${p.id}" style="margin-top:12px"><option value="">Ôºã Add someone to this project‚Ä¶</option>${cand.map(x=>`<option value="${x.id}">${esc(x.name)} ‚Äî ${esc(x.company||x.title)}</option>`).join('')}</select>`:''})():''}</div>
${isStaff()&&canManage(p)&&p.team.length?`<div class="card"><h3>Roles on this project</h3><div class="tiny faint" style="margin-bottom:10px">Roles change from project to project. The editing team (Main Editor, Sr Editor, 1st Asst. Editor, Asst Editor, DIT) can edit scenes, VFX shots and storage data here.</div><div class="list">${p.team.filter(i=>U(i)).map(i=>`<div class="item" style="gap:10px">${av(U(i),28)}<div class="grow"><b style="font-weight:500">${esc(U(i).name)}</b><div class="tiny faint">${esc(U(i).title||'')}</div></div><select data-change="projRole" data-arg="${p.id}|${i}" style="width:170px"><option value="">‚Äî no project role ‚Äî</option>${Object.entries(PROJ_ROLES).map(([k,l])=>`<option value="${k}" ${pRole(p,i)===k?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')}</div></div>`:''}${showMoney?`<div class="card"><h3>${u.role==='client'?'Quotation':'Money'}</h3><div class="row"><span class="faint">Quoted</span><b class="right num">${money(p.quote)}</b></div><div class="row"><span class="faint">Paid</span><b class="right num" style="color:var(--ok)">${money(p.paid)}</b></div><div class="row"><span class="faint">Remaining</span><b class="right num">${money(rem)}</b></div><div style="margin-top:8px">${bar(p.quote?p.paid/p.quote*100:0,'green')}</div>
${u.role!=='client'&&row&&(isOwner()||can('fin.budgetsAll')||(can('fin.budgetsOwn')&&p.producer===u.id))?`<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px"><div class="row"><span class="faint">Costs</span><b class="right num">${money(row.cost)}</b></div><div class="row"><span class="faint">Paid out</span><b class="right num">${money(row.paid)}</b></div></div>`:''}<div class="tiny faint" style="margin-top:8px">${S.fin.source==='cashflow'?'Published from Cashflow '+ago(S.fin.pulledAt):'Demo figures'}</div></div>`:''}</div></div>
${previewsHTML(p)}`};
TABS.breakdown=p=>TYPES[p.type].episodic&&p.episodes?breakdownSeries(p):breakdownShort(p);
function canEditFlow(p){return canDo('proj.breakdown',p)||leadsProject(p)}
/* ================= episodes ¬∑ scenes ¬∑ versions ¬∑ VFX shots ¬∑ briefs ¬∑ report ================= */
const EDIT_ROLES={main:'Main Editor',sr:'Sr Editor',a1:'1st Asst. Editor',asst:'Asst Editor',dit:'DIT'};
const PROJ_ROLES=Object.assign({},EDIT_ROLES,{vfx:'VFX Supervisor',color:'Colorist',sound:'Sound',crew:'Crew'});
const EP_ST=[['blank','Blank',''],['offline','Offline edit','gold'],['vfx','VFX working','lilac'],['grading','Grading','info'],['sound','Sound mix','info'],['mastering','Mastering','gold'],['qc','QC','warn'],['delivered','Delivered','ok']];
const EPST=Object.fromEntries(EP_ST.map(x=>[x[0],x]));
const SHOT_ST={todo:['Not started',''],wip:['Working','gold'],review:['In review','info'],approved:['Approved','ok'],rejected:['Rejected','bad']};
const SND_ST={todo:['Not started',''],wip:['Working','gold'],review:['In review','info'],done:['Done','ok']};
const VEND_ST=['todo','wip','review'];
const VFX_K={none:'No VFX',vfx:'VFX',ai:'AI VFX'};
const pRole=(p,id)=>((p&&p.roles)||{})[id||meId]||'';
const isMgr=u=>{u=u||me();return!!u&&(u.role==='owner'||u.role==='manager')};
function canManage(p){return isMgr()||p.producer===meId||leadsProject(p)}
function editTeam(p){return canManage(p)||!!EDIT_ROLES[pRole(p)]}
function canStorage(p){return can('storage.manage')||(!!p&&isStaff()&&editTeam(p))}
function canApprove(p){const u=me();return canManage(p)||u.job==='vfxsup'||pRole(p)==='vfx'}
const epDone=e=>(e.statuses||[]).includes('delivered');
const isPlaceholder=s=>!s.versions&&!s.dur&&!s.st&&(!s.loc||s.loc==='‚Äî')&&!s.note;
function scCalc(s){if(!s.versions)return;const v=s.versions.find(x=>x.id===s.sel)||s.versions[s.versions.length-1];s.sel=v?v.id:null;if(v&&!(+v.dur)&&+s.dur)v.dur=+s.dur;s.dur=v&&+v.dur?+v.dur:(+s.dur||0);s.st=s.locked?3:s.versions.length?Math.min(2,s.versions.length):0}
function normEp(p,e){const T=TYPES[p.type],last=T.stages.length-1;
 if(!e.v2){e.scenes=(e.scenes||[]).filter(s=>!isPlaceholder(s));
  e.statuses=e.statuses||[(e.stage||0)>=last?'delivered':(e.stage||0)>=T.edit?'offline':'blank'];
  e.checks=e.checks||{};for(let i=0;i<Math.min(e.stage||0,last);i++)if(!e.checks[i])e.checks[i]={done:true};if((e.stage||0)>=last)e.checks[last]={done:true};e.v2=1}
 e.scenes=e.scenes||[];e.statuses=e.statuses&&e.statuses.length?e.statuses:['blank'];e.checks=e.checks||{};e.sound=e.sound||{assignee:'',brief:'',items:[]};e.sound.items=e.sound.items||[];
 e.scenes.forEach((s,i)=>{if(!s.n)s.n=i+1;if(!s.id)s.id='s'+e.n+'_'+s.n;if(s.chars==null)s.chars='';if(s.note==null)s.note='';if(!s.vfx)s.vfx='none';if(!s.shots)s.shots=[];
  if(!s.versions){s.versions=s.dur||s.st?[{id:s.id+'v1',l:s.st>=2?'v2':'v1',dur:s.dur||0}]:[];s.sel=s.versions[0]?s.versions[0].id:null;s.locked=s.st===3}scCalc(s)});
 return e}
function syncStage(p,e){e.checks=e.checks||{};const last=TYPES[p.type].stages.length-1;if(epDone(e)){e.stage=last;return}let i=0;while(i<last&&e.checks[i]&&e.checks[i].done)i++;e.stage=Math.min(i,last-1)}
function NP(p){if(!p||!p.episodes)return p;if(isStaff()&&canEditFlow(p)){p.episodes.forEach(e=>normEp(p,e));return p}const c=JSON.parse(JSON.stringify(p));c.episodes.forEach(e=>normEp(c,e));return c}
const epRun=e=>(e.scenes||[]).reduce((a,s)=>a+(+s.dur||0),0);
const shotsOf=e=>(e.scenes||[]).flatMap(s=>s.vfx&&s.vfx!=='none'?(s.shots||[]).map(h=>({s,h})):[]);
const shotDur=e=>shotsOf(e).reduce((a,x)=>a+(+x.h.dur||0),0);
function crewOpts(p,sel,blank){const ids=[...new Set([p.producer,...p.team,...(p.partners||[])])].filter(i=>U(i));return`<option value="">${blank||'‚Äî unassigned ‚Äî'}</option>`+ids.map(i=>{const x=U(i);return`<option value="${i}" ${sel===i?'selected':''}>${esc(x.name)}${x.role==='partner'?' ¬∑ '+esc(x.company||'partner'):''}</option>`}).join('')}
const who=id=>{const x=U(id);return x?esc(x.name)+(x.role==='partner'?' <span class="chip lilac" style="font-size:10px;padding:0 6px">'+esc(x.company||'Partner')+'</span>':''):'<span class="faint">Unassigned</span>'};
const stChip=(m,k)=>{const x=m[k]||m.todo;return`<span class="chip ${x[1]}" style="font-size:11px">${x[0]}</span>`};
function sec(k,title,meta,body,defOpen){const open=V.open[k]===true;return`<div class="sec"><div class="sh" data-act="tog" data-arg="${k}|0"><span class="faint">${open?'‚ñæ':'‚ñ∏'}</span><b style="font-weight:600">${title}</b><span class="tiny faint grow">${meta||''}</span></div>${open?`<div class="sb">${body}</div>`:''}</div>`}
const epChips=(e,max)=>{const s=e.statuses||[];const v=max&&s.length>max?s.slice(0,max):s;return v.map(k=>`<span class="chip ${EPST[k]?EPST[k][2]:''}" style="font-size:11px">${esc(EPST[k]?EPST[k][1]:k)}</span>`).join(' ')+(max&&s.length>max?` <span class="tiny faint">+${s.length-max}</span>`:'')};

function breakdownSeries(p0){const p=NP(p0);const ce=canEditFlow(p),mg=canManage(p);const T=TYPES[p.type];
const tot=[...p.episodes,...(p.epX?[p.epX]:[])].reduce((a,e)=>a+epRun(e),0);const del=p.episodes.filter(epDone).length;const scenes=p.episodes.reduce((a,e)=>a+e.scenes.length,0);const locked=p.episodes.reduce((a,e)=>a+e.scenes.filter(s=>s.locked).length,0);
const sh=p.episodes.flatMap(shotsOf);const ap=sh.filter(x=>x.h.status==='approved').length;
return kpis([['Show progress',projProg(p)+'%','','hero'],['Episodes delivered',del+'/'+p.episodes.length],[T.unit+'s locked',locked+'/'+scenes,''],['VFX shots approved',ap+'/'+sh.length]])+
`<div class="row wrap" style="margin:14px 0 10px"><div class="tiny faint grow">Open an episode for its status, checkpoints, ${T.unit.toLowerCase()}s, VFX shots and sound brief. Everything folds open and closed.</div><a class="btn sm ghost" data-act="epAll" data-arg="1">Expand all</a><a class="btn sm ghost" data-act="epAll" data-arg="0">Collapse all</a></div>
${p.episodes.map(e=>epBlock(p,e,ce,mg)).join('')}`}

function epBlock(p,e,ce,mg){const T=TYPES[p.type];const pr=epProg(p,e);const run=epRun(e);const lk=e.scenes.filter(s=>s.locked).length;const open=V.open[p.id+'-'+e.n];const sh=shotsOf(e);
return`<div class="ep ${open?'open':''}"><div class="ep-row" data-act="toggleEp" data-arg="${e.n}"><b style="font-family:var(--display)">EP${pad2(e.n)}</b><span class="hide-s" style="white-space:nowrap;overflow:hidden">${epChips(e,2)}</span>${bar(pr,epDone(e)?'green':'')}<b class="tiny">${pr}%</b><span class="tiny ${run>e.target+60?'':'faint'}" style="${run>e.target+60?'color:var(--warn)':''}">${mmss(run)} / ${tgtTxt(e)}</span><span class="tiny faint hide-s">${lk}/${e.scenes.length} locked${sh.length?' ¬∑ '+sh.length+' VFX':''}</span><span class="faint">${open?'‚ñæ':'‚ñ∏'}</span></div>
${open?`<div class="ep-body">${epStatusSec(p,e,mg)}${epCheckSec(p,e,mg)}${epSceneSec(p,e,ce,mg)}${epSoundSec(p,e,mg)}</div>`:''}</div>`}

function epStatusSec(p,e,mg){const k='st'+p.id+e.n;
const body=`<div class="row wrap" style="gap:6px">${EP_ST.map(([key,l,c])=>{const on=e.statuses.includes(key);return mg?`<a class="chip ${on?c||'info':''} tgl ${on?'on':''}" data-act="toggleSt" data-arg="${e.n}|${key}" style="cursor:pointer">${on?'‚úì ':''}${esc(l)}</a>`:on?`<span class="chip ${c}">${esc(l)}</span>`:''}).join('')}</div><div class="tiny faint" style="margin-top:8px">${mg?'Set by the producer or managers. Several can be on at once ‚Äî work runs in parallel (e.g. VFX working while grading).':'Set by the producer.'}</div>`;
return sec(k,'Episode status',epChips(e),body,true)}

function epCheckSec(p,e,mg){const T=TYPES[p.type];const et=editTeam(p);const k='ck'+p.id+e.n;const n=T.stages.length;const done=T.stages.filter((_,i)=>e.checks[i]&&e.checks[i].done).length;
const body=`<div class="list">${T.stages.map((s,i)=>{const c=e.checks[i]||{};const can=mg||et||(c.who&&c.who===meId);return`<div class="item" style="gap:10px"><a class="chk ${c.done?'on':''}" ${can?`data-act="toggleCheck" data-arg="${e.n}|${i}" title="${c.done?'Untick for amends ‚Äî goes back to undone':'Tick when done'}"`:''} style="${can?'':'cursor:default'}">${c.done?ic('check',14):''}</a><div class="grow"><b style="font-weight:500;${c.done?'':'color:var(--faint)'}">${esc(s)}</b>${c.done&&c.by?`<div class="tiny faint">‚úì ${esc((U(c.by)||{}).name||'')} ¬∑ ${ago(c.ts)}</div>`:c.reopened?`<div class="tiny" style="color:var(--warn)">Reopened for amends ${ago(c.reopened)}${c.rby?' by '+esc((U(c.rby)||{}).name||''):''}</div>`:''}</div>
${mg?`<select data-change="checkWho" data-arg="${e.n}|${i}" style="width:190px">${crewOpts(p,c.who||'','Who makes it‚Ä¶')}</select>`:c.who?`<span class="tiny faint">${who(c.who)}</span>`:''}</div>`}).join('')}</div><div class="tiny faint" style="margin-top:8px">Producers follow these; the person who makes each step ticks it. Untick a step when there are amends ‚Äî it goes back to undone.</div>`;
return sec(k,'Checkpoints',`${done}/${n} done`,body,false)}

function epSceneSec(p,e,ce,mg){const T=TYPES[p.type];const k='sc'+p.id+e.n;const u=T.unit;
const tools=`<div class="row wrap" style="margin-bottom:10px;align-items:flex-end">${ce?`<a class="btn sm pri" data-act="addScene" data-arg="${e.n}">${ic('plus',14)}Add ${u.toLowerCase()}</a><label class="btn sm" style="letter-spacing:normal;text-transform:none;color:var(--text)">${ic('upload',14)}Import EDL / CSV<input type="file" hidden accept=".edl,.csv,.txt,.xml" data-change="importEDL" data-arg="${e.n}"></label>`:''}${mg?`<label style="width:150px" class="tiny">Target runtime<input value="${mmss(e.target)}" data-change="bk" data-arg="e${e.n}.target"></label>`:''}<span class="tiny faint right">Runtime counts the selected version of each ${u.toLowerCase()}.</span></div>`;
const rows=e.scenes.length?`<div class="tablewrap scn"><table><thead><tr><th style="width:52px">${u.slice(0,2)}</th><th>Characters</th><th style="width:90px">VFX</th><th style="width:80px">Version</th><th style="width:80px">Duration</th><th style="width:110px">Status</th><th style="width:20px"></th></tr></thead><tbody>${e.scenes.map(s=>sceneRow(p,e,s,ce,mg)).join('')}</tbody></table></div>`:`<div class="empty tiny" style="padding:18px">No ${u.toLowerCase()}s yet${ce?` ‚Äî use <b>Ôºã Add ${u.toLowerCase()}</b> to start`:''}.</div>`;
return sec(k,u+'s',`${e.scenes.length} ¬∑ ${mmss(epRun(e))}`,tools+rows,true)}

function sceneRow(p,e,s,ce,mg){const k='sn'+s.id;const open=V.open[k];const v=s.versions.find(x=>x.id===s.sel);const sh=s.vfx!=='none'?s.shots:[];const ap=sh.filter(h=>h.status==='approved').length;
return`<tr class="item click" style="cursor:pointer" data-act="tog" data-arg="${k}|0"><td><b>${s.n}</b></td><td class="tiny">${esc(s.chars)||'<span class="faint">‚Äî</span>'}${s.note?`<div class="tiny faint" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px">${esc(s.note)}</div>`:''}</td><td>${s.vfx!=='none'?`<span class="chip ${s.vfx==='ai'?'lilac':'info'}" style="font-size:11px">${VFX_K[s.vfx]}${sh.length?' ¬∑ '+ap+'/'+sh.length:''}</span>`:'<span class="tiny faint">‚Äî</span>'}</td><td>${v?`<span class="chip" style="font-size:11px">${esc(v.l)}</span>${s.versions.length>1?`<span class="tiny faint"> of ${s.versions.length}</span>`:''}`:'<span class="tiny faint">‚Äî</span>'}</td><td class="num">${mmss(s.dur)}</td><td><span class="chip ${s.locked?'ok':s.versions.length?'gold':''}" style="font-size:11px">${s.locked?'Locked':s.versions.length?'In edit':'Not cut'}</span></td><td class="faint">${open?'‚ñæ':'‚ñ∏'}</td></tr>${open?`<tr><td colspan="7" style="padding:0 0 8px">${sceneDetail(p,e,s,ce,mg)}</td></tr>`:''}`}

function sceneDetail(p,e,s,ce,mg){const b=`e${e.n}.s${s.id}`;const et=editTeam(p);const ro=!ce;
const vers=`<div class="eyebrow" style="margin:12px 0 6px">Versions <span class="faint" style="text-transform:none;letter-spacing:normal">‚Äî the selected one is the one calculated</span></div>${s.versions.length?`<div class="list">${s.versions.map(v=>{const on=v.id===s.sel;return`<div class="item" style="gap:8px"><a class="chk ${on?'on':''}" ${ce?`data-act="selVer" data-arg="${e.n}|${s.id}|${v.id}"`:''} title="Use this version">${on?ic('check',13):''}</a>${ce?`<input value="${esc(v.l)}" data-change="bk" data-arg="${b}.v${v.id}.l" style="width:110px"><input value="${mmss(v.dur)}" data-change="bk" data-arg="${b}.v${v.id}.dur" style="width:90px" title="hh:mm:ss ‚Äî type 142 for 00:01:42">`:`<b>${esc(v.l)}</b><span class="num">${mmss(v.dur)}</span>`}${on?'<span class="chip ok" style="font-size:10.5px">Counts</span>':''}<span class="grow"></span>${ce&&s.versions.length>1?`<a class="faint" data-act="delVer" data-arg="${e.n}|${s.id}|${v.id}" style="cursor:pointer" title="Remove version">${ic('x',14)}</a>`:''}</div>`}).join('')}</div>`:'<div class="tiny faint">No versions yet.</div>'}${ce?`<a class="btn sm ghost" style="margin-top:8px" data-act="addVer" data-arg="${e.n}|${s.id}">${ic('plus',13)}Add version</a>`:''}`;
return`<div class="sub"><div class="formgrid mini"><label>${TYPES[p.type].unit} number${ro?`<div>${esc(s.n)}</div>`:`<input value="${esc(s.n)}" data-change="bk" data-arg="${b}.n" placeholder="e.g. 14A">`}</label><label>Characters${ro?`<div>${esc(s.chars)||'‚Äî'}</div>`:`<input value="${esc(s.chars)}" data-change="bk" data-arg="${b}.chars" placeholder="e.g. Younes, Dalia">`}</label>
<label>VFX${ro?`<div>${VFX_K[s.vfx]}</div>`:`<select data-change="bk" data-arg="${b}.vfx">${Object.entries(VFX_K).map(([k,l])=>`<option value="${k}" ${s.vfx===k?'selected':''}>${l}</option>`).join('')}</select>`}</label>
<label class="full">${TYPES[p.type].unit} notes${ro?`<div>${esc(s.note)||'‚Äî'}</div>`:`<textarea rows="2" data-change="bk" data-arg="${b}.note" placeholder="Notes for the edit‚Ä¶">${esc(s.note)}</textarea>`}</label></div>
${vers}
<div class="row" style="margin-top:12px">${ce?`<a class="chk ${s.locked?'on':''}" data-act="lockScene" data-arg="${e.n}|${s.id}">${s.locked?ic('check',13):''}</a><span class="tiny">Picture locked</span>`:''}<span class="grow"></span>${mg?`<a class="btn sm ghost" data-act="delScene" data-arg="${e.n}|${s.id}">${ic('trash',13)}Delete ${TYPES[p.type].unit.toLowerCase()}</a>`:''}</div>
${s.vfx!=='none'?shotsSec(p,e,s,et):''}</div>`}

function shotsSec(p,e,s,et){const k='sh'+s.id;const ap=s.shots.filter(h=>h.status==='approved').length;const dur=s.shots.reduce((a,h)=>a+(+h.dur||0),0);const appr=canApprove(p);
const body=`${s.shots.length?s.shots.map(h=>shotRow(p,e,s,h,et,appr)).join(''):'<div class="tiny faint">No shots yet.</div>'}${et?`<a class="btn sm ghost" style="margin-top:8px" data-act="addShot" data-arg="${e.n}|${s.id}">${ic('plus',13)}Add shot</a>`:''}<div class="tiny faint" style="margin-top:6px">Shots are named and numbered by the editing team (Main Editor, Sr Editor, 1st Asst. Editor, Asst Editor, DIT), producers and managers.</div>`;
return sec(k,(s.vfx==='ai'?'AI VFX':'VFX')+' shots',`${s.shots.length} shots ¬∑ ${mmss(dur)} ¬∑ ${ap}/${s.shots.length} approved`,body,true)}

function shotRow(p,e,s,h,et,appr){const b=`e${e.n}.s${s.id}.h${h.id}`;const k='hb'+h.id;const open=V.open[k];const mine=h.assignee===meId;
const stSel=(et||mine)&&!['approved'].includes(h.status)||et?`<select data-change="bk" data-arg="${b}.status" style="width:120px">${Object.entries(SHOT_ST).filter(([kk])=>appr||!['approved','rejected'].includes(kk)||kk===h.status).map(([kk,l])=>`<option value="${kk}" ${h.status===kk?'selected':''}>${l[0]}</option>`).join('')}</select>`:stChip(SHOT_ST,h.status);
return`<div class="sub" style="padding:8px 10px"><div class="shot">${et?`<input value="${esc(h.n)}" data-change="bk" data-arg="${b}.n" title="Shot number">`:`<b>#${esc(h.n)}</b>`}${et?`<input value="${esc(h.name)}" data-change="bk" data-arg="${b}.name" placeholder="Shot name">`:`<span>${esc(h.name)||'‚Äî'}</span>`}${et?`<input value="${mmss(h.dur)}" data-change="bk" data-arg="${b}.dur" title="hh:mm:ss">`:`<span class="num">${mmss(h.dur)}</span>`}${et?`<select data-change="bk" data-arg="${b}.assignee">${crewOpts(p,h.assignee,'Assign to‚Ä¶')}</select>`:`<span class="tiny">${who(h.assignee)}</span>`}${stSel}
<span class="row" style="gap:4px">${appr&&h.status!=='approved'?`<a class="btn sm" data-act="approveShot" data-arg="${e.n}|${s.id}|${h.id}" title="Approve">${ic('check',13)}</a>`:''}${appr&&h.status!=='rejected'?`<a class="btn sm ghost" data-act="rejectShot" data-arg="${e.n}|${s.id}|${h.id}" title="Reject with a reason">${ic('x',13)}</a>`:''}${et?`<a class="faint" data-act="delShot" data-arg="${e.n}|${s.id}|${h.id}" style="cursor:pointer" title="Remove shot">${ic('trash',13)}</a>`:''}</span><a class="faint" data-act="tog" data-arg="${k}|0" style="cursor:pointer" title="Brief">${open?'‚ñæ':'‚ñ∏'}</a></div>
${h.status==='rejected'&&h.reason?`<div class="tiny" style="color:var(--bad);margin-top:6px">Rejected: ${esc(h.reason)}</div>`:''}
${open?`<div style="margin-top:8px"><div class="eyebrow" style="margin-bottom:4px">Brief</div>${et?`<textarea rows="3" data-change="bk" data-arg="${b}.brief" placeholder="What to do in this shot, references, deliver spec‚Ä¶">${esc(h.brief)}</textarea>`:`<div class="tiny">${esc(h.brief)||'‚Äî'}</div>`}${h.vnote?`<div class="tiny faint" style="margin-top:6px">Note from ${who(h.assignee)}: ${esc(h.vnote)}</div>`:''}</div>`:''}</div>`}

function epSoundSec(p,e,mg){const et=editTeam(p);const so=e.sound;const k='so'+p.id+e.n;const b=`e${e.n}.snd`;const mine=so.assignee===meId;const dn=so.items.filter(i=>i.status==='done').length;
const body=`<div class="formgrid mini"><label>Sound by${et?`<select data-change="bk" data-arg="${b}.assignee">${crewOpts(p,so.assignee,'Internal or partner‚Ä¶')}</select>`:`<div>${who(so.assignee)}</div>`}</label><span></span>
<label class="full">Sound brief${et?`<textarea rows="2" data-change="bk" data-arg="${b}.brief" placeholder="Mix spec, loudness, stems, M&E‚Ä¶">${esc(so.brief)}</textarea>`:`<div>${esc(so.brief)||'‚Äî'}</div>`}</label></div>
<div class="eyebrow" style="margin:10px 0 6px">Items</div>${so.items.length?`<div class="list">${so.items.map(i=>{const ib=`${b}.i${i.id}`;return`<div class="item" style="gap:8px">${et?`<input value="${esc(i.name)}" data-change="bk" data-arg="${ib}.name" placeholder="e.g. Dialogue edit" style="max-width:240px">`:`<b style="font-weight:500">${esc(i.name)}</b>`}${et||mine?`<select data-change="bk" data-arg="${ib}.status" style="width:130px">${Object.entries(SND_ST).map(([kk,l])=>`<option value="${kk}" ${i.status===kk?'selected':''}>${l[0]}</option>`).join('')}</select>`:stChip(SND_ST,i.status)}<span class="tiny faint grow">${esc(i.vnote||'')}</span>${et?`<a class="faint" data-act="delSnd" data-arg="${e.n}|${i.id}" style="cursor:pointer">${ic('x',14)}</a>`:''}</div>`}).join('')}</div>`:'<div class="tiny faint">No sound items yet.</div>'}${et?`<a class="btn sm ghost" style="margin-top:8px" data-act="addSnd" data-arg="${e.n}">${ic('plus',13)}Add item</a>`:''}`;
return sec(k,'Sound brief',`${so.assignee?(U(so.assignee)||{}).name||'':'unassigned'} ¬∑ ${dn}/${so.items.length} done`,body,false)}

/* ---- briefs tab: VFX shots & sound handed to someone (partners see only theirs) ---- */
TABS.briefs=p0=>{const u=me();const ext=u.role==='partner';const p=NP(p0);const mineOnly=ext||!editTeam(p)||V.open['bmine'+p.id];const appr=!ext&&canApprove(p);
const items=[];p.episodes.forEach(e=>{shotsOf(e).forEach(({s,h})=>{if(!mineOnly||h.assignee===u.id)items.push({e,s,h})})});
const snd=p.episodes.filter(e=>e.sound&&(e.sound.items.length||e.sound.brief)&&(!mineOnly||e.sound.assignee===u.id));
const stSel=(e,kind,id,cur,map)=>{const opts=ext?VEND_ST.concat(VEND_ST.includes(cur)?[]:[cur]):Object.keys(map).filter(k=>appr||!['approved','rejected'].includes(k)||k===cur);return`<select data-change="vst" data-arg="${e.n}|${kind}|${id}" style="width:130px">${opts.map(k=>`<option value="${k}" ${cur===k?'selected':''}>${(map[k]||[k])[0]}</option>`).join('')}</select>`};
return`<div class="row" style="margin-bottom:12px"><div class="tiny faint grow">${ext?'The VFX shots and sound work handed to you on this project ‚Äî update your status and leave a note for the team.':'Every VFX shot and sound brief on this project, with who has it and where it stands.'}</div>${!ext&&editTeam(p)?`<a class="btn sm ghost" data-act="tog" data-arg="bmine${p.id}|0">${V.open['bmine'+p.id]?'Show all':'Only mine'}</a>`:''}</div>
<div class="sec-title"><h2>VFX shots</h2><span class="tiny faint right">${items.length} ¬∑ ${mmss(items.reduce((a,x)=>a+(+x.h.dur||0),0))}</span></div>
${items.length?items.map(({e,s,h})=>{const k='bb'+h.id;const open=V.open[k]===true;const mine=h.assignee===u.id;return`<div class="ep ${open?'open':''}"><div class="ep-row br" style="grid-template-columns:auto 1fr auto auto 18px" data-act="tog" data-arg="${k}|0"><b style="font-family:var(--display)">EP${pad2(e.n)} ¬∑ ${TYPES[p.type].unit.slice(0,2)} ${s.n} ¬∑ #${esc(h.n)}</b><span>${esc(h.name)||'‚Äî'} <span class="tiny faint">¬∑ ${mmss(h.dur)} ¬∑ ${s.vfx==='ai'?'AI VFX':'VFX'}</span></span><span class="tiny hide-s">${ext?'':who(h.assignee)}</span>${stChip(SHOT_ST,h.status)}<span class="faint">${open?'‚ñæ':'‚ñ∏'}</span></div>
${open?`<div class="ep-body"><div class="eyebrow" style="margin-bottom:4px">Brief</div><div style="white-space:pre-wrap">${esc(h.brief)||'<span class="faint">No brief yet</span>'}</div>${h.status==='rejected'&&h.reason?`<div class="tiny" style="color:var(--bad);margin-top:8px">Rejected: ${esc(h.reason)}</div>`:h.status==='approved'?'<div class="tiny" style="color:var(--ok);margin-top:8px">Approved ‚úì</div>':''}
${mine||(!ext&&editTeam(p))?`<div class="row wrap" style="margin-top:10px;align-items:flex-end">${h.status==='approved'&&ext?'':`<label class="tiny" style="width:150px">Status${stSel(e,'shot',h.id,h.status,SHOT_ST)}</label>`}<label class="tiny grow">Note to the team<input value="${esc(h.vnote||'')}" data-change="vnote" data-arg="${e.n}|shot|${h.id}" placeholder="e.g. v2 uploaded to Frame.io"></label></div>`:h.vnote?`<div class="tiny faint" style="margin-top:6px">Note: ${esc(h.vnote)}</div>`:''}</div>`:''}</div>`}).join(''):'<div class="card empty">No VFX shots logged</div>'}
<div class="sec-title"><h2>Sound</h2></div>
${snd.length?snd.map(e=>{const so=e.sound;const mine=so.assignee===u.id;return`<div class="card" style="margin-bottom:10px"><div class="row"><b style="font-family:var(--display)">EP${pad2(e.n)}</b>${ext?'':`<span class="tiny">${who(so.assignee)}</span>`}<span class="tiny faint right">${so.items.filter(i=>i.status==='done').length}/${so.items.length} done</span></div>${so.brief?`<div style="margin-top:8px;white-space:pre-wrap">${esc(so.brief)}</div>`:''}
<div class="list" style="margin-top:8px">${so.items.map(i=>`<div class="item" style="gap:8px"><b style="font-weight:500" class="grow">${esc(i.name)||'‚Äî'}</b>${mine||(!ext&&editTeam(p))?(i.status==='done'&&ext?stChip(SND_ST,'done'):stSel(e,'sound',i.id,i.status,SND_ST))+`<input value="${esc(i.vnote||'')}" data-change="vnote" data-arg="${e.n}|sound|${i.id}" placeholder="Note" style="max-width:220px">`:stChip(SND_ST,i.status)}</div>`).join('')}</div></div>`}).join(''):'<div class="card empty">No sound briefs here yet</div>'}`};

/* ---- status report: every episode at a glance (can be shared with the client) ---- */
TABS.report=p0=>{const u=me();const cl=u.role==='client';if(cl&&!p0.reportShared)return'<div class="card empty">The studio hasn‚Äôt shared the status report yet.</div>';const p=NP(p0);const T=TYPES[p.type];const n=T.stages.length;
const del=p.episodes.filter(epDone).length;const tot=[...p.episodes,...(p.epX?[p.epX]:[])].reduce((a,e)=>a+epRun(e),0);const sh=p.episodes.flatMap(shotsOf);
return`<div class="row wrap" style="margin-bottom:12px">${!cl?`<a class="chk ${p.reportShared?'on':''}" ${canManage(p)?'data-act="shareReport"':''}>${p.reportShared?ic('check',13):''}</a><span class="tiny">${p.reportShared?'Shared with the client ‚Äî they see this page (no internal notes or vendor names)':'Not shared with the client yet'}</span>`:'<span class="tiny faint">Live status from the studio ‚Äî updates as the work moves.</span>'}<a class="btn sm right" data-act="printReport">${ic('doc',14)}Download status report as PDF</a></div>
${kpis([['Show progress',projProg(p)+'%','','hero'],['Episodes delivered',del+'/'+p.episodes.length],['Cut runtime',Math.floor(tot/3600)+'h '+Math.floor(tot%3600/60)+'m',''],['VFX shots approved',sh.filter(x=>x.h.status==='approved').length+'/'+sh.length]])}
<div class="card tablewrap" style="margin-top:14px"><table><thead><tr><th>Ep</th><th>Status</th><th style="width:150px">Progress</th><th>Checkpoints</th><th>${T.unit}s locked</th><th>Runtime</th><th>VFX</th><th>Sound</th><th></th></tr></thead><tbody>${p.episodes.map(e=>{const k='rp'+p.id+e.n;const open=V.open[k];const pr=epProg(p,e);const done=T.stages.filter((_,i)=>e.checks[i]&&e.checks[i].done).length;const es=shotsOf(e);const si=e.sound.items;
return`<tr class="item click" style="cursor:pointer" data-act="tog" data-arg="${k}|0"><td><b style="font-family:var(--display)">EP${pad2(e.n)}</b></td><td>${epChips(e)}</td><td><div class="row" style="gap:8px">${bar(pr,epDone(e)?'green':'')}<b class="tiny">${pr}%</b></div></td><td class="tiny">${done}/${n}</td><td class="tiny">${e.scenes.filter(s=>s.locked).length}/${e.scenes.length}</td><td class="tiny num">${mmss(epRun(e))} / ${tgtTxt(e)}</td><td class="tiny">${es.length?es.filter(x=>x.h.status==='approved').length+' of '+es.length+' shots approved':'No VFX shots'}</td><td class="tiny">${si.length?si.filter(i=>i.status==='done').length+'/'+si.length:'‚Äî'}</td><td class="faint">${open?'‚ñæ':'‚ñ∏'}</td></tr>
${open?`<tr><td colspan="9"><div class="sub"><div class="eyebrow" style="margin-bottom:6px">Checkpoints</div><div class="row wrap" style="gap:6px">${T.stages.map((s,i)=>{const c=e.checks[i]||{};return`<span class="chip ${c.done?'ok':''}" style="font-size:11px">${c.done?'‚úì':'‚óã'} ${esc(s)}</span>`}).join('')}</div>
${e.scenes.length?`<div class="eyebrow" style="margin:12px 0 6px">${T.unit}s</div><table><thead><tr><th>${T.unit.slice(0,2)}</th><th>Characters</th><th>Version</th><th>Duration</th><th>VFX</th><th>Status</th></tr></thead><tbody>${e.scenes.map(s=>{const v=s.versions.find(x=>x.id===s.sel);const hs=s.vfx!=='none'?s.shots:[];return`<tr><td>${s.n}</td><td class="tiny">${esc(s.chars)||'‚Äî'}</td><td class="tiny">${v?esc(v.l):'‚Äî'}</td><td class="tiny num">${mmss(s.dur)}</td><td class="tiny">${s.vfx!=='none'?VFX_K[s.vfx]+(hs.length?' ¬∑ '+hs.filter(h=>h.status==='approved').length+'/'+hs.length+' approved':''):'‚Äî'}</td><td><span class="chip ${s.locked?'ok':s.versions.length?'gold':''}" style="font-size:10.5px">${s.locked?'Locked':s.versions.length?'In edit':'Not cut'}</span></td></tr>`}).join('')}</tbody></table>`:''}</div></td></tr>`:''}`}).join('')}</tbody></table></div>`};

function breakdownShort(p){const ce=canEditFlow(p);const st=STG(p);return`<div class="card"><div class="row" style="margin-bottom:14px"><div><div class="eyebrow">${esc(TYPES[p.type].label)} flow</div><div class="tiny faint">Team: ${esc(TYPES[p.type].team)}</div></div>${ce?`<div class="right row"><a class="btn sm ghost" data-act="stageMove" data-arg="${p.id}|-1">Previous stage</a><a class="btn sm pri" data-act="stageMove" data-arg="${p.id}|1">${p.stage>=st.length-1?'Mark delivered':'Next stage'}</a></div>`:''}</div>
<div class="list">${st.map((s,i)=>{const done=p.status==='done'||i<p.stage,cur=i===p.stage&&p.status!=='done';const ts=S.tasks.filter(t=>t.project===p.id&&t.stage===i);return`<div class="item"><span class="iconbtn" style="width:32px;height:32px;${done?'color:var(--ok);border-color:rgba(95,211,168,.4)':cur?'color:var(--gold2);border-color:var(--gold)':'color:var(--line2)'}">${done?ic('check',15):`<b style="font-size:12px">${i+1}</b>`}</span><div class="grow"><b style="font-weight:500;${cur?'color:var(--gold2)':done?'':'color:var(--faint)'}">${esc(s)}</b>${ts.length?`<div class="tiny faint">${ts.map(t=>esc(t.title)).join(' ¬∑ ')}</div>`:''}</div>${cur?'<span class="chip gold">Now</span>':done?'<span class="chip ok">Done</span>':''}</div>`}).join('')}</div></div>`}
TABS.tasks=p=>{const u=me();let ts=S.tasks.filter(t=>t.project===p.id);if(u.role==='partner')ts=ts.filter(t=>tAs(t,u.id));const cols=[['todo','To do'],['doing','In progress'],['review','In review'],['done','Done']];const lead=canDo('proj.tasks',p);
return`<div class="row" style="margin-bottom:12px"><div class="tiny faint">${u.role==='partner'?'Everything we‚Äôve handed over to you on this project.':'Open a card for its spec sheet: codec, resolution, watermark and delivery method.'}</div>${lead?`<a class="btn pri sm right" data-act="newTask" data-arg="${p.id}">${ic('plus',14)}New task</a>`:''}</div>
<div class="kanban">${cols.map(([k,l])=>{const c=ts.filter(t=>t.status===k);return`<div class="kcol"><h4>${l.toUpperCase()}<span>${c.length}</span></h4>${c.map(t=>{const a=U(t.assignee);const [dt,dc]=dueTxt(t.due);const mv=lead||tAs(t,u.id);return`<div class="kcard ${tAs(t,u.id)?'mine':''}" data-act="taskOpen" data-arg="${t.id}"><div class="t">${esc(t.title)}</div><div class="row wrap" style="gap:6px"><span class="chip" style="font-size:10.5px">${esc(STG(p)[t.stage]||'')}</span>${t.status!=='done'?`<span class="chip ${dc}" style="font-size:10.5px">${dt}</span>`:''}</div><div class="row" style="margin-top:10px">${a?av(a,24):'<span class="chip warn" style="font-size:10.5px">Unassigned</span>'}${mv?`<div class="right row" style="gap:4px">${k!=='todo'?`<a class="btn sm ghost" data-act="taskMove" data-arg="${t.id}|-1">‚óÄ</a>`:''}${k!=='done'?`<a class="btn sm" data-act="taskMove" data-arg="${t.id}|1">‚ñ∂</a>`:''}</div>`:''}</div></div>`}).join('')||'<div class="tiny faint" style="padding:8px">‚Äî</div>'}</div>`}).join('')}</div>`};

async function scanFolder(list){const files=Array.from(list);if(!files.length)return;const ext={};let total=0,video=0,minT=Infinity,maxT=0;const VID=/\.(mov|mxf|mp4|r3d|braw|ari|arx|crm|mts|m2ts|avi|dng|cine)$/i;const AUD=/\.(wav|aif|aiff|mp3|bwf)$/i;
for(const f of files){total+=f.size;const m=f.name.match(/\.([^.]+)$/);const e=m?m[1].toUpperCase():'‚Äî';ext[e]=(ext[e]||0)+1;if(VID.test(f.name))video++;if(f.lastModified){minT=Math.min(minT,f.lastModified);maxT=Math.max(maxT,f.lastModified)}}
const paths=files.map(f=>f.webkitRelativePath||f.name).join('\n');let camera='Unknown';
if(/XDROOT|\.XML$/im.test(paths)&&ext.MXF)camera='Sony (XAVC / XDCAM)';else if(ext.BRAW)camera='Blackmagic (BRAW)';else if(ext.R3D)camera='RED (R3D)';else if(ext.ARI||ext.ARX||/ARRI/i.test(paths))camera='ARRI';else if(ext.CRM||/CANON/i.test(paths))camera='Canon (Cinema RAW)';else if(/DCIM/i.test(paths)&&ext.MP4)camera='Mirrorless / DSLR (DCIM)';else if(ext.MOV)camera='QuickTime (MOV)';
const fmts=Object.entries(ext).filter(([e])=>VID.test('.'+e)||AUD.test('.'+e)).sort((a,b)=>b[1]-a[1]).map(([e])=>e).slice(0,5);const root=(files[0].webkitRelativePath||'').split('/')[0]||'Selected folder';const topDirs=[...new Set(files.map(f=>(f.webkitRelativePath||'').split('/')[1]).filter(Boolean))].slice(0,6);
const usedGB=Math.round(total/1e9*10)/10;const scanned=`${root}: ${nf.format(files.length)} files ¬∑ ${kb(total)} ¬∑ ${video} video files ¬∑ ${fmts.join(', ')||'no video formats'} ¬∑ ${camera}${minT<Infinity?` ¬∑ shot ${dstr(minT)} ‚Äì ${dstr(maxT)}`:''}`;
devForm(null,{scanned,usedGB,files:files.length,video,formats:fmts,camera,content:`${root}${topDirs.length?' ‚Äî '+topDirs.join(', '):''}`,owner:'client'})}

const TEXT_EXT=/\.(txt|md|csv|srt|edl|xml|json)$/i;
function processFile(f,maxSide){maxSide=maxSide||LIMITS.imgMax;return new Promise(res=>{
if(f.type.startsWith('image/')){if(f.size>LIMITS.imgRaw)return res({err:`${f.name}: images over 25 MB aren‚Äôt accepted`});const url=URL.createObjectURL(f);const img=new Image();
img.onload=()=>{const sc=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,w,h);
let d=c.toDataURL('image/webp',.86);let ext='.webp';if(!d.startsWith('data:image/webp')){d=c.toDataURL('image/jpeg',.88);ext='.jpg'}URL.revokeObjectURL(url);const size=Math.round((d.length-d.indexOf(',')-1)*.75);res({kind:'image',name:f.name.replace(/\.[^.]+$/,'')+ext,size,orig:f.size,data:d,w,h})};
img.onerror=()=>{URL.revokeObjectURL(url);res({err:`${f.name}: couldn‚Äôt read this image`})};img.src=url;return}
if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){if(f.size>LIMITS.pdf)return res({err:`${f.name}: PDFs are limited to 10 MB ‚Äî compress it or share a OneDrive link`});return res({kind:'pdf',name:f.name,size:f.size})}
if(f.type.startsWith('text/')||TEXT_EXT.test(f.name)){if(f.size>LIMITS.text)return res({err:`${f.name}: text files are limited to 1 MB`});return res({kind:'text',name:f.name,size:f.size})}
if(f.type.startsWith('video/'))return res({err:`${f.name}: videos stay on Frame.io / OneDrive ‚Äî add a link instead`});res({err:`${f.name}: this file type isn‚Äôt allowed`})})}
async function handleFiles(list,cb){for(const f of Array.from(list)){const r=await processFile(f);if(r.err){toast(r.err,'bad');continue}if(r.kind==='image'&&r.orig)toast(`${r.name}: ${kb(r.orig)} ‚Üí ${kb(r.size)} (${r.w}√ó${r.h})`,'ok');cb(r)}}
function renderPending(){const el=document.getElementById('pend');if(!el)return;el.innerHTML=pending.map((f,i)=>`<div>${f.kind==='image'?`<img src="${f.data}" alt="">`:ic('doc',14)}<span>${esc(f.name)} ¬∑ ${kb(f.size)}</span><a data-act="unpend" data-arg="${i}" style="cursor:pointer">${ic('x',12)}</a></div>`).join('')}
function parseEDL(text){const out=[];text.split(/\r?\n/).forEach(line=>{const all=line.match(/\d{2}:\d{2}:\d{2}[:;]\d{2}/g);if(/^\s*\d{3,}/.test(line)&&all&&all.length>=4){const s=t=>{const m=t.split(/[:;]/).map(Number);return m[0]*3600+m[1]*60+m[2]+m[3]/25};out.push(Math.max(0,Math.round(s(all[3])-s(all[2]))))}});
if(!out.length)text.split(/\r?\n/).forEach(line=>{const m=line.match(/^\s*(\d+)\s*[,;\t]\s*([\d:.]+)/);if(m){const d=parseMMSS(m[2]);if(d!=null)out.push(d)}});return out}

 for(const g of segs){if(g==='snd'){o=e&&e.sound;kind='snd'}else{const k=g[0],id=g.slice(1);kind=k;
  if(k==='e'){e=p.episodes.find(x=>x.n===+id);o=e}else if(k==='s'){s=e&&e.scenes.find(x=>x.id===id);o=s}else if(k==='v')o=s&&s.versions.find(x=>x.id===id);else if(k==='h')o=s&&s.shots.find(x=>x.id===id);else if(k==='i')o=e&&e.sound&&e.sound.items.find(x=>x.id===id)}
  if(!o)return null}
 return{o,f,e,s,kind}}

async function subKey(ep){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ep));return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,40)}
async function pushSave(sub){const j=sub.toJSON();const{error}=await sb.from('push_subs').upsert({id:await subKey(j.endpoint),user_id:meId,data:{endpoint:j.endpoint,keys:j.keys,ua:navigator.userAgent.slice(0,160)}});if(error)throw error}
async function pushDrop(){if(!APP.sub||!LIVE)return;try{await sb.from('push_subs').delete().eq('id',await subKey(APP.sub.endpoint))}catch(e){}}

const UNDO=[],REDO=[];let HBASE=null,histMute=false;
function histRows(){const m=new Map();TB.forEach(([k,tb,to])=>{if(k==='notifs')return;(S[k]||[]).forEach(x=>{try{const r=to(x);m.set(k+'\u0001'+r.id,JSON.stringify(r))}catch(e){}})});return m}
function histBase(){HBASE=histRows();undoBtns()}
function histRecord(){if(histMute||!me())return;const cur=histRows();if(!HBASE){HBASE=cur;return}const ch=[];cur.forEach((js,key)=>{const b=HBASE.get(key);if(b!==js)ch.push([key,b||null,js])});HBASE.forEach((js,key)=>{if(!cur.has(key))ch.push([key,js,null])});HBASE=cur;if(!ch.length)return;UNDO.push(ch);if(UNDO.length>60)UNDO.shift();REDO.length=0;undoBtns()}
function histApply(ch,useAfter){ch.forEach(([key,b,a])=>{const v=useAfter?a:b;const[k,id]=key.split('\u0001');const d=TB.find(x=>x[0]===k);if(!d)return;const arr=S[k]||(S[k]=[]);const i=arr.findIndex(x=>x.id===id);if(v==null){if(i>=0)arr.splice(i,1);return}const rec=fromRow(d[1],JSON.parse(v));if(i>=0&&arr[i].pwd&&!rec.pwd)rec.pwd=arr[i].pwd;if(i>=0)arr[i]=rec;else arr.push(rec)})}
