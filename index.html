<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03100c">
<title>SCENEDROME Hub</title>
<link rel="icon" id="brandIcon" href="assets/s.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link id="brandFonts" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#03100c;--panel:rgba(8,28,23,.88);--panel2:#0d2a23;--field:#06180f;--line:#173c33;--line2:#24524a;--text:#eef3ef;--muted:#9fb9b0;--faint:#5f7f75;
--gold:#d6a03d;--gold2:#f0c46a;--grad:linear-gradient(90deg,#f0c46a,#d6a03d 60%,#a8741f);--ok:#5fd3a8;--bad:#ef7d6c;--warn:#f0c46a;--info:#6cc3e0;--lilac:#b9a6e8;
--bgimg:url("assets/bg.jpg");--markimg:url("assets/s.png");--display:"Montserrat","Helvetica Neue",Arial,sans-serif;--body:"Poppins","Helvetica Neue",Arial,sans-serif;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg) var(--bgimg) center top/cover fixed no-repeat;color:var(--text);font:400 13.5px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-transform:uppercase;letter-spacing:.01em}
h1{font-weight:800;font-size:24px;line-height:1.1}h2{font-weight:700;font-size:17px}h3{font-weight:700;font-size:14px;letter-spacing:.04em}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:9px;padding:9px 12px;width:100%;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
select option{background:#0a241d}
textarea{resize:vertical}
label{display:block;font:400 10.5px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
label>input,label>select,label>textarea{margin-top:6px;letter-spacing:normal;text-transform:none;font-size:13.5px;color:var(--text)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.tiny{font-size:12px}.grow{flex:1;min-width:0}.right{margin-left:auto}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:10px}.wrap{flex-wrap:wrap}
.eyebrow{font:400 10.5px var(--body);letter-spacing:.3em;text-transform:uppercase;color:var(--faint)}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel2);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;white-space:nowrap;transition:transform .15s,border .2s}
.btn:hover{border-color:var(--gold)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);border:0;color:#1a1204;font-weight:600;box-shadow:0 8px 22px -12px rgba(240,196,106,.8)}
.btn.ghost{background:transparent}.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}.btn.wide{width:100%}
.btn.ok{background:rgba(95,211,168,.12);border-color:rgba(95,211,168,.35);color:var(--ok)}
.btn[disabled]{opacity:.4;pointer-events:none}
.iconbtn{width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--panel2);cursor:pointer;position:relative;flex:none}
.iconbtn:hover{border-color:var(--gold)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:500;background:#12302a;color:#c9dbd4;white-space:nowrap}
.chip.gold{background:#2a2210;color:var(--gold2)}.chip.ok{background:rgba(95,211,168,.13);color:var(--ok)}.chip.warn{background:rgba(240,196,106,.13);color:var(--warn)}.chip.bad{background:rgba(239,125,108,.14);color:var(--bad)}.chip.info{background:rgba(108,195,224,.13);color:var(--info)}.chip.lilac{background:rgba(185,166,232,.14);color:var(--lilac)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;backdrop-filter:blur(6px)}
.card h3{margin-bottom:12px}
.card.hover{transition:transform .2s,border .2s;cursor:pointer}.card.hover:hover{transform:translateY(-2px);border-color:var(--line2)}
.card.hero{background:linear-gradient(135deg,rgba(214,160,61,.18),var(--panel) 62%);border-color:#5a4520;position:relative;overflow:hidden}
.card.hero::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.span2{grid-column:span 2}
.kpi .l{font:400 10.5px var(--body);letter-spacing:.26em;text-transform:uppercase;color:var(--faint)}
.kpi .v{font:700 22px/1.2 var(--display);margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.bar{height:7px;background:#0a241d;border:1px solid var(--line);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.green>i{background:linear-gradient(90deg,#2a9c78,var(--ok))}
.av{border-radius:50%;display:inline-grid;place-items:center;font:700 13px var(--display);color:#fff;flex:none;background-size:cover;background-position:center;border:2px solid #03100c}
.stack{display:flex}.stack .av{margin-left:-8px}.stack .av:first-child{margin-left:0}
.list>.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.list>.item:first-child{border-top:0;padding-top:0}
.item.click{cursor:pointer}.item.click:hover b{color:var(--gold2)}
.sec-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sec-title .num{width:26px;height:26px;border-radius:7px;background:#2a2210;color:var(--gold2);display:grid;place-items:center;font:700 13px var(--display)}
.empty{padding:26px;text-align:center;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{font:500 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#b9d2c9;text-align:left;padding:8px 10px;background:#0d2e27;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #12322b;vertical-align:middle}tr:last-child td{border-bottom:0}
td input,td select{padding:5px 8px;font-size:12.5px}
.tablewrap{overflow-x:auto}
.num{font-variant-numeric:tabular-nums}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.login-art{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:52px;background:rgba(1,8,6,.35)}
.login-art img.logo{width:min(420px,80%)}
.login-art .big{font:800 clamp(30px,4.2vw,54px)/1.04 var(--display);text-transform:uppercase;letter-spacing:-.01em}
.login-art .big em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.login-art p{color:var(--muted);max-width:440px}
.login-side{display:grid;place-items:center;padding:32px;background:rgba(3,16,12,.72);border-left:1px solid var(--line)}
.login-card{width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
.demo-box{margin-top:6px;padding:14px;border:1px dashed var(--line2);border-radius:12px}
.demo-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.demo-chip{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:11.5px;transition:border .2s}
.demo-chip:hover{border-color:var(--gold)}
/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:rgba(2,12,9,.86);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:10;backdrop-filter:blur(8px)}
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--line)}
.brand img{width:100%;max-width:180px;max-height:70px;object-fit:contain;object-position:left;display:block}.brand .sub{font:300 10.5px var(--body);letter-spacing:.42em;text-transform:uppercase;color:var(--faint);margin-top:8px}
.nav{flex:1;overflow:auto;padding:10px 10px 16px}
.nav h6{font:400 10px var(--body);letter-spacing:.32em;text-transform:uppercase;color:var(--faint);margin:14px 10px 6px}
.nav a{display:flex;gap:11px;align-items:center;padding:8px 11px;border-radius:9px;color:var(--muted);cursor:pointer;text-decoration:none;position:relative;border:1px solid transparent}
.nav a:hover{color:var(--text);background:rgba(15,54,44,.6)}.nav a.on{background:linear-gradient(90deg,rgba(214,160,61,.16),transparent);color:var(--text);border-color:#3b2f17}.nav a.on svg{color:var(--gold2)}
.side-foot{margin:10px;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.side-foot:hover{border-color:var(--gold)}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(3,16,12,.88);backdrop-filter:blur(12px);z-index:8}
.top h2{font:800 20px var(--display)}
.viewas{display:flex;align-items:center;gap:8px}.viewas select{width:auto;padding:6px 10px;font-size:12px;max-width:260px}
.content{padding:22px 26px 90px;max-width:1320px}
.content>*{animation:rise .4s both}.content>*:nth-child(2){animation-delay:.04s}.content>*:nth-child(3){animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.hello{display:flex;align-items:center;gap:18px;padding:20px 22px;border-radius:16px;background:linear-gradient(135deg,rgba(214,160,61,.16),rgba(8,28,23,.9) 55%);border:1px solid #3b2f17;margin-bottom:16px;position:relative;overflow:hidden}
.hello::after{content:"";position:absolute;right:-30px;bottom:-40px;width:170px;height:200px;background:var(--markimg) center/contain no-repeat;opacity:.07}
.hello h1{font-size:22px}
.bellwrap{position:relative}
.bellpanel{position:absolute;right:0;top:46px;width:360px;max-height:460px;overflow:auto;background:#0a241d;border:1px solid var(--line2);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.6);display:none;z-index:30}
.bellpanel.open{display:block;animation:rise .2s}
.bellpanel .n{display:flex;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}.bellpanel .n:hover{background:#0f362c}.bellpanel .n.unread{background:rgba(214,160,61,.07)}
.badge{position:absolute;top:-5px;right:-5px;background:var(--gold);color:#1a1204;font-size:10px;font-weight:700;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0;overflow-x:auto}
.tabs a{padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font:500 12px var(--body);letter-spacing:.14em;text-transform:uppercase}
.tabs a.on{color:var(--text);border-color:var(--gold)}
.seg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg a{padding:5px 12px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--muted)}.seg a.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px #3b2f17}
.phead{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.stages{display:flex;gap:3px;margin-top:6px}.stages .st{flex:1;text-align:center;min-width:0}
.stages .st i{display:block;height:6px;border-radius:99px;background:#12302a;margin-bottom:6px}.stages .st.done i{background:var(--ok)}.stages .st.cur i{background:var(--grad);box-shadow:0 0 12px rgba(240,196,106,.55)}
.stages .st span{font-size:10px;color:var(--faint);line-height:1.2;display:block;overflow:hidden;text-overflow:ellipsis}.stages .st.cur span{color:var(--gold2);font-weight:500}.stages .st.done span{color:var(--muted)}
/* chat */
.chat{display:flex;flex-direction:column;height:min(640px,calc(100vh - 300px));min-height:420px;padding:0;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}
.chat-scroll{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;max-width:78%;animation:rise .25s both}.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .meta{font-size:11px;color:var(--faint);margin-bottom:3px}.msg.me .meta{text-align:right}
.bubble{background:#0f332a;border:1px solid var(--line);padding:9px 14px;border-radius:16px 16px 16px 5px;white-space:pre-wrap;word-wrap:break-word}
.msg.me .bubble{background:var(--grad);border:0;color:#1a1204;border-radius:16px 16px 5px 16px}
.bubble .mention{font-weight:600;color:var(--gold2)}.msg.me .bubble .mention{color:#4a2f00}
.att{display:flex;flex-direction:column;gap:6px;margin-top:6px}.att img{max-width:260px;max-height:200px;border-radius:12px;display:block;object-fit:cover}
.att .file{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.25);font-size:12px}
.reacts{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}.msg.me .reacts{justify-content:flex-end}
.reacts span{font-size:12px;padding:1px 7px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}.reacts span.mine{border-color:var(--gold)}
.reacts .add{opacity:0;transition:opacity .2s}.msg:hover .reacts .add{opacity:1}
.daydiv{align-self:center;font-size:11px;color:var(--faint);background:var(--field);border:1px solid var(--line);padding:2px 10px;border-radius:99px}
.composer{display:flex;gap:8px;align-items:flex-end;padding:12px;border-top:1px solid var(--line);background:rgba(4,22,17,.9)}
.composer textarea{min-height:42px;max-height:140px;border-radius:12px}
.pend{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px}.pend:empty{display:none}.pend>div{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:4px 8px;font-size:12px;margin-top:8px}
.pend img{width:28px;height:28px;object-fit:cover;border-radius:6px}
.rules{font-size:11px;color:var(--faint);padding:6px 14px 10px;background:rgba(4,22,17,.9)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto}
.kanban.k5{grid-template-columns:repeat(5,minmax(200px,1fr))}
.kcol{background:rgba(4,22,17,.75);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:180px}
.kcol h4{font:400 10.5px var(--body);letter-spacing:.24em;color:var(--faint);padding:4px 6px 10px;display:flex;justify-content:space-between}
.kcard{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:8px;cursor:pointer;transition:transform .15s,border .2s}
.kcard:hover{border-color:var(--line2);transform:translateY(-1px)}.kcard.mine{border-left:3px solid var(--gold)}
.kcard .t{font-weight:500;margin-bottom:8px}
.ep{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:rgba(4,22,17,.75);overflow:hidden}
.ep-row{display:grid;grid-template-columns:58px 160px 1fr 48px 110px 110px 20px;align-items:center;gap:12px;padding:11px 14px;cursor:pointer}
.ep-row:hover,.ep.open .ep-row{background:#0f332a}
.ep-body{padding:14px;border-top:1px solid var(--line)}
.dropzone{border:1.5px dashed var(--line2);border-radius:12px;padding:22px;text-align:center;transition:border .2s,background .2s;cursor:pointer;display:block;letter-spacing:normal;text-transform:none;font-size:13px;color:var(--text)}
.dropzone.over,.dropzone:hover{border-color:var(--gold);background:rgba(214,160,61,.06)}
.filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fcard .thumb{height:120px;background:#06180f center/cover;display:grid;place-items:center;color:var(--faint)}.fcard .b{padding:10px 12px}
.cover{height:150px;position:relative}
.pcard{overflow:hidden;padding:0}.pinfo{padding:0 22px 22px;margin-top:-46px;position:relative}
.covers{display:flex;gap:8px}.covers a{width:34px;height:22px;border-radius:6px;cursor:pointer;border:2px solid transparent}.covers a.on{border-color:var(--gold2)}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;margin:0 6px 6px 0}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--faint)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:7px 12px;font-size:13px;margin:0}.kv dt{color:var(--faint)}.kv dd{margin:0}
.switch{width:36px;height:20px;border-radius:99px;background:#12302a;border:1px solid var(--line2);position:relative;cursor:pointer;display:inline-block;transition:background .2s;vertical-align:middle;flex:none}
.switch::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#9fb9b0;top:2px;left:2px;transition:left .2s,background .2s}
.switch.on{background:#5a4520;border-color:var(--gold)}.switch.on::after{left:18px;background:var(--gold2)}.switch.fixed{opacity:.45;cursor:not-allowed}
.permgroup{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:rgba(4,22,17,.6)}
.permgroup h4{font:400 10.5px var(--body);letter-spacing:.26em;color:var(--gold2);margin-bottom:8px}
.perm{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid #12322b}.perm:first-of-type{border-top:0}
.perm .d{font-size:12.5px}.perm .def{font-size:10.5px;color:var(--faint)}
.tier{padding:18px;border-radius:14px;background:linear-gradient(135deg,#2a2210,#0a1a12);border:1px solid #5a4520}
.offer{padding:18px;border-radius:14px;border:1px solid var(--line2);background:linear-gradient(135deg,rgba(214,160,61,.14),rgba(8,28,23,.9))}
.steps{display:flex;flex-direction:column;gap:0}.steps .s{display:grid;grid-template-columns:26px 150px 1fr;gap:10px;padding:8px 0;border-top:1px solid #12322b;align-items:start}.steps .s:first-child{border-top:0}
.steps .n{width:22px;height:22px;border-radius:6px;background:#2a2210;color:var(--gold2);display:grid;place-items:center;font:700 11px var(--display)}
.pill-steps{display:flex;gap:4px;flex-wrap:wrap}.pill-steps span{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--faint)}.pill-steps span.on{border-color:rgba(95,211,168,.5);color:var(--ok);background:rgba(95,211,168,.08)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.modal-bg{position:fixed;inset:0;background:rgba(1,6,4,.72);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:120;animation:fade .2s;padding:16px}
@keyframes fade{from{opacity:0}}
.modal{width:min(620px,100%);max-height:88vh;overflow:auto;background:#0a241d;border:1px solid var(--line2);border-radius:18px;padding:22px;animation:rise .25s}
.modal.wide{width:min(880px,100%)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid .full{grid-column:1/-1}
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center}
.toast{background:#0d2a23;border:1px solid var(--line2);padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:rise .25s;max-width:90vw}
.toast.ok{border-color:rgba(95,211,168,.55)}.toast.bad{border-color:rgba(239,125,108,.6)}
.confetti{position:fixed;width:8px;height:12px;z-index:210;pointer-events:none;border-radius:2px}
.draftnote{font-size:11px;color:var(--faint);padding:8px 10px;border-radius:10px;border:1px dashed var(--line2);margin:0 10px 0;line-height:1.4}
/* finance overlay */
#cfLayer{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:#03100c}
#cfLayer.open{display:flex}
#cfLayer .cfbar{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid #5a4520;background:linear-gradient(90deg,rgba(214,160,61,.18),#03100c);height:auto;border-radius:0;overflow:visible}
#cfLayer iframe{flex:1;border:0;width:100%;background:#03100c}

function projCard(p,opts){opts=opts||{};const pr=projProg(p);const cl=U(p.client);const nextT=S.tasks.filter(t=>t.project===p.id&&t.status!=='done').sort((a,b)=>a.due-b.due)[0];const ppl=[...new Set([p.producer,...p.team,...(p.partners||[])])].map(U).filter(Boolean);
return`<div class="card hover" data-act="openProject" data-arg="${p.id}"><div class="row"><div class="grow"><div class="eyebrow">${esc(TYPES[p.type].label)}</div><h3 style="margin:5px 0 2px">${esc(p.name)}</h3><div class="tiny faint">${esc(cl?cl.company:'Internal')} · ${esc(p.format)}</div></div>${ring(pr,52)}</div>
<div style="margin:12px 0 8px">${bar(pr)}</div><div class="row tiny"><span class="chip ${p.status==='done'?'ok':'gold'}">${esc(projStage(p))}</span><span class="right faint">${p.status==='done'?'Delivered '+ago(p.due):dueTxt(p.due)[0].replace('Due','Final due')}</span></div>

function threadsFor(){const u=me();const out=[];visibleProjects(u).forEach(p=>channelsFor(p,u).forEach(ch=>{const ms=S.msgs.filter(m=>m.project===p.id&&m.ch===ch);out.push({p,ch,last:ms[ms.length-1],count:ms.length})}));return out.sort((a,b)=>(b.last?b.last.ts:0)-(a.last?a.last.ts:0))}
function chLabel(ch){return ch==='client'?'Client':me().role==='partner'?'Collab':'Team'}
function latestThreads(n){const ts=threadsFor().filter(t=>t.last).slice(0,n||4);if(!ts.length)return'<div class="empty">No conversations yet</div>';
return`<div class="list">${ts.map(t=>{const a=U(t.last.user);return`<div class="item click" data-act="openThread" data-arg="${t.p.id}|${t.ch}">${av(a,32)}<div class="grow"><b style="font-weight:500">${esc(t.p.name)}</b> <span class="chip ${t.ch==='client'?'lilac':'info'}" style="font-size:10px;padding:0 7px">${chLabel(t.ch)}</span><div class="tiny faint" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(first(a))}: ${esc(t.last.text||'📎 attachment')}</div></div><span class="tiny faint">${ago(t.last.ts)}</span></div>`}).join('')}</div>`}
function kpis(arr){return`<div class="grid g4">${arr.map(x=>`<div class="card kpi ${x[3]||''}"><div class="l">${x[0]}</div><div class="v">${x[1]}</div><div class="s">${x[2]||''}</div></div>`).join('')}</div>`}
function finOverviewKPIs(){const rows=S.fin.rows;let coll=rows.reduce((a,r)=>a+(+r.received||0),0),left=rows.reduce((a,r)=>a+Math.max(0,+r.toCollect||0),0);if(!isOwner()&&S.fin.totals){coll=S.fin.totals.collected;left=S.fin.totals.toCollect}return[['Collected',money(coll),S.fin.source==='cashflow'?'Published from Cashflow '+ago(S.fin.pulledAt):'Demo figures','hero'],['Still to collect',money(left),'Across active projects']]}
function homeLead(){const u=me();const ps=visibleProjects().filter(p=>p.status==='active');const pend=can('team.leaves')?S.leaves.filter(l=>l.status==='pending'):[];const open=S.tasks.filter(t=>t.status!=='done'&&ps.some(p=>p.id===t.project));const overdue=open.filter(t=>t.due<Date.now());const unas=can('proj.tasks')?open.filter(t=>!t.assignee):[];const review=open.filter(t=>t.status==='review');
const needs=[];pend.forEach(l=>{const x=U(l.user);needs.push(`<div class="item">${av(x,30)}<div class="grow"><b style="font-weight:500">${esc(x.name)}</b> asked for ${l.days} day${l.days>1?'s':''} off<div class="tiny faint">${esc(l.type)} · from ${dstr(l.from)}${l.note?' · '+esc(l.note):''}</div></div><a class="btn sm ok" data-act="leaveDecide" data-arg="${l.id}|approved">Approve</a><a class="btn sm ghost" data-act="leaveDecide" data-arg="${l.id}|declined">Decline</a></div>`)});
if(isOwner()||can('fin.expenses'))S.expenses.filter(x=>x.status==='pending').forEach(x=>needs.push(`<div class="item click" data-act="go" data-arg="finance">${av(U(x.by),30)}<div class="grow"><b style="font-weight:500">Expense request · ${money(x.amount)}</b><div class="tiny faint">${esc(x.note)} · ${esc((P(x.project)||{}).name||'Studio')}</div></div><span class="chip warn">To record</span></div>`));
if(isOwner()){const pe=S.entries.filter(e=>e.status==='submitted');if(pe.length)needs.unshift(`<div class="item click" data-act="go" data-arg="finance"><span class="iconbtn" style="width:30px;height:30px;color:var(--gold2)">${ic('wallet',14)}</span><div class="grow"><b style="font-weight:500">${pe.length} project money entr${pe.length>1?'ies':'y'} to review</b><div class="tiny faint">From ${[...new Set(pe.map(e=>first(U(e.by)||{name:'?'})))].join(', ')} — record them in the Cashflow</div></div><span class="chip warn">Review</span></div>`)}
review.forEach(t=>needs.push(`<div class="item click" data-act="taskOpen" data-arg="${t.id}">${av(U(t.assignee),30)}<div class="grow"><b style="font-weight:500">${esc(t.title)}</b><div class="tiny faint">Waiting for review · ${esc(P(t.project).name)}</div></div><span class="chip warn">Review</span></div>`));
unas.forEach(t=>needs.push(`<div class="item click" data-act="taskOpen" data-arg="${t.id}"><span class="iconbtn" style="width:30px;height:30px">${ic('user',14)}</span><div class="grow"><b style="font-weight:500">${esc(t.title)}</b><div class="tiny faint">Nobody assigned yet · ${esc(P(t.project).name)}</div></div><span class="chip">Assign</span></div>`));
const k=[];if(isOwner()||can('fin.overview'))k.push(...finOverviewKPIs());k.push(['Active projects',ps.length,ps.reduce((a,p)=>a+(p.episodes?p.episodes.length:1),0)+' deliverables in flight'],['Open tasks',open.length,overdue.length?overdue.length+' overdue':'Nothing overdue 🎯']);
if(can('storage.view'))k.push(['Drives in studio',S.devices.filter(d=>d.owner==='client'&&!['Returned','Sent out'].includes(d.status)).length,S.devices.filter(d=>d.status==='Ready to return').length+' ready to return']);if(can('mkt.view'))k.push(['Marketing',S.mkt.filter(m=>m.status!=='published').length+' open',S.mkt.filter(m=>m.status==='approval').length+' need approval']);
return helloCard(needs.length?`${needs.length} thing${needs.length>1?'s':''} need you today.`:'All clear — the studio is humming.',isOwner()?`<a class="btn pri" data-act="cfOpen">${ic('wallet',16)}Open Cashflow</a>`:'')+kpis(k.slice(0,4))+
`<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Needs you</h3>${needs.length?`<div class="list">${needs.join('')}</div>`:'<div class="empty">Nothing waiting on you 🎉</div>'}</div><div class="card"><h3>Latest in threads</h3>${latestThreads(5)}</div></div>
<div class="sec-title"><h2>${can('proj.all')||isOwner()?'All active projects':'Your projects'}</h2><a class="btn sm ghost right" data-act="go" data-arg="projects">See all</a></div><div class="grid g3">${ps.map(p=>projCard(p)).join('')||'<div class="card empty">No projects yet</div>'}</div>`}
function homeProducer(){const u=me();const ps=visibleProjects().filter(p=>p.status==='active');const pids=ps.map(p=>p.id);const open=S.tasks.filter(t=>pids.includes(t.project)&&t.status!=='done');const unas=open.filter(t=>!t.assignee);const week=open.filter(t=>t.due<Date.now()+7*D);const myDrives=S.devices.filter(d=>pids.includes(d.project)&&!['Returned'].includes(d.status));

kpis([['My projects',ps.length],['Open tasks',open.length],['Unassigned',unas.length],['Drives on my projects',myDrives.length,myDrives.filter(d=>d.status==='Ready to return').length+' ready to return']])+
`<div class="sec-title"><h2>My projects</h2></div><div class="grid g3">${ps.map(p=>projCard(p)).join('')}</div>

async function scanFolder(list){const files=Array.from(list);if(!files.length)return;const ext={};let total=0,video=0,minT=Infinity,maxT=0;const VID=/\.(mov|mxf|mp4|r3d|braw|ari|arx|crm|mts|m2ts|avi|dng|cine)$/i;const AUD=/\.(wav|aif|aiff|mp3|bwf)$/i;
for(const f of files){total+=f.size;const m=f.name.match(/\.([^.]+)$/);const e=m?m[1].toUpperCase():'—';ext[e]=(ext[e]||0)+1;if(VID.test(f.name))video++;if(f.lastModified){minT=Math.min(minT,f.lastModified);maxT=Math.max(maxT,f.lastModified)}}
const paths=files.map(f=>f.webkitRelativePath||f.name).join('\n');let camera='Unknown';
if(/XDROOT|\.XML$/im.test(paths)&&ext.MXF)camera='Sony (XAVC / XDCAM)';else if(ext.BRAW)camera='Blackmagic (BRAW)';else if(ext.R3D)camera='RED (R3D)';else if(ext.ARI||ext.ARX||/ARRI/i.test(paths))camera='ARRI';else if(ext.CRM||/CANON/i.test(paths))camera='Canon (Cinema RAW)';else if(/DCIM/i.test(paths)&&ext.MP4)camera='Mirrorless / DSLR (DCIM)';else if(ext.MOV)camera='QuickTime (MOV)';
const fmts=Object.entries(ext).filter(([e])=>VID.test('.'+e)||AUD.test('.'+e)).sort((a,b)=>b[1]-a[1]).map(([e])=>e).slice(0,5);const root=(files[0].webkitRelativePath||'').split('/')[0]||'Selected folder';const topDirs=[...new Set(files.map(f=>(f.webkitRelativePath||'').split('/')[1]).filter(Boolean))].slice(0,6);
const usedGB=Math.round(total/1e9*10)/10;const scanned=`${root}: ${nf.format(files.length)} files · ${kb(total)} · ${video} video files · ${fmts.join(', ')||'no video formats'} · ${camera}${minT<Infinity?` · shot ${dstr(minT)} – ${dstr(maxT)}`:''}`;
devForm(null,{scanned,usedGB,files:files.length,video,formats:fmts,camera,content:`${root}${topDirs.length?' — '+topDirs.join(', '):''}`,owner:'client'})}

VIEWS.branding=()=>{if(!isOwner())return deny();const b=B();const col=(k,l)=>`<label>${l}<div class="row" style="margin-top:6px"><input type="color" value="${esc(b[k])}" data-change="brandSet" data-arg="${k}" style="width:46px;height:36px;padding:2px"><input value="${esc(b[k])}" data-change="brandSet" data-arg="${k}" style="font-family:monospace"></div></label>`;
const txt=(k,l,area)=>`<label class="${area?'full':''}">${l}${area?`<textarea rows="${k==='headline'?3:2}" data-change="brandSet" data-arg="${k}">${esc(b[k])}</textarea>`:`<input value="${esc(b[k])}" data-change="brandSet" data-arg="${k}">`}</label>`;

<div class="sec-title"><h2>Names & words</h2></div><div class="card"><div class="formgrid">${txt('studio','Studio name')}${txt('hubName','Portal name (e.g. Hub)')}${txt('domain','Web address shown')}${txt('footer','Login footer line')}${txt('welcome','Login title')}${txt('signinHelp','Login help line')}${txt('headline','Login headline — one line per row, the last row is highlighted',true)}${txt('tagline','Login description',true)}</div></div>`};
async function brandImage(f,max){if(f.type==='image/svg+xml'){if(f.size>400000)return{err:'SVG is over 400 KB'};return await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r({data:fr.result});fr.readAsDataURL(f)})}
if(!f.type.startsWith('image/'))return{err:'Please pick an image'};if(f.size>LIMITS.imgRaw)return{err:'Images over 25 MB aren’t accepted'};
return await new Promise(res=>{const url=URL.createObjectURL(f);const img=new Image();img.onload=()=>{const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
 const d=f.type==='image/jpeg'?c.toDataURL('image/jpeg',.86):(()=>{const w=c.toDataURL('image/webp',.9);return w.startsWith('data:image/webp')?w:c.toDataURL('image/png')})();res({data:d})};img.onerror=()=>res({err:'Couldn’t read this image'});img.src=url})}
function brandSave(){applyBrand();if(LIVE)save();else{try{localStorage.setItem(KEY+'-brand',JSON.stringify(BRAND))}catch(e){toast('Image too large to keep in this draft browser','bad')}}}

/* ================= modals & toasts ================= */
function modal(title,html,wide){document.getElementById('modal').innerHTML=`<div class="modal-bg" data-act="closeModalBg"><div class="modal ${wide?'wide':''}"><div class="mh"><h2>${title}</h2><a class="iconbtn" data-act="closeModal">${ic('x')}</a></div>${html}</div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}
function toast(t,k){const el=document.createElement('div');el.className='toast '+(k||'');el.textContent=t;document.getElementById('toasts').appendChild(el);setTimeout(()=>{el.style.transition='opacity .4s';el.style.opacity='0';setTimeout(()=>el.remove(),400)},3400)}
function confetti(x,y){const cs=['#f0c46a','#d6a03d','#5fd3a8','#eef3ef','#a8741f'];for(let i=0;i<36;i++){const c=document.createElement('div');c.className='confetti';c.style.background=cs[i%cs.length];c.style.left=x+'px';c.style.top=y+'px';document.body.appendChild(c);const a=Math.random()*Math.PI*2,v=120+Math.random()*220;c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+160}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1100+Math.random()*500,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>c.remove()}}

modal(esc(t.title),`<div class="row wrap" style="margin-bottom:14px"><span class="chip">${esc(p.name)}</span><span class="chip gold">${esc(STG(p)[t.stage]||'')}</span><span class="chip ${dueTxt(t.due)[1]}">${dueTxt(t.due)[0]}</span><span class="chip ${t.prio==='high'?'bad':''}">${t.prio} priority</span></div>
<div class="row" style="margin-bottom:14px">${a?av(a,32)+`<div><b style="font-weight:500">${esc(a.name)}</b><div class="tiny faint">${esc(a.company||a.title)}</div></div>`:'<span class="chip warn">Unassigned</span>'}</div>
<div class="eyebrow" style="margin-bottom:6px">Brief</div><div style="margin-bottom:16px">${esc(t.brief)||'<span class="faint">—</span>'}</div>
<div class="card" style="background:rgba(4,22,17,.7)"><div class="eyebrow" style="margin-bottom:10px">Spec sheet · export & delivery</div><dl class="kv"><dt>Codec / format</dt><dd>${esc(sp.codec)}</dd><dt>Resolution</dt><dd>${esc(sp.res)}</dd><dt>Frame rate</dt><dd>${esc(sp.fps)} fps</dd><dt>Audio</dt><dd>${esc(sp.audio)}</dd><dt>Preview watermark</dt><dd>${esc(sp.wm)}</dd><dt>Deliver via</dt><dd><span class="chip lilac">${esc(sp.delivery)}</span></dd>${sp.link?`<dt>Link</dt><dd><a href="${esc(sp.link)}" target="_blank" rel="noopener">${esc(sp.link)}</a></dd>`:''}</dl></div>
${mv&&t.status!=='done'?`<div class="row" style="margin-top:16px">${t.status!=='todo'?`<a class="btn ghost" data-act="taskMove" data-arg="${t.id}|-1">◀ Back</a>`:''}<a class="btn pri right" data-act="taskMove" data-arg="${t.id}|1">${t.status==='review'?ic('check',16)+'Mark done':'Move forward ▶'}</a></div>`:''}`)}

/* ================= uploads ================= */
const TEXT_EXT=/\.(txt|md|csv|srt|edl|xml|json)$/i;
function processFile(f,maxSide){maxSide=maxSide||LIMITS.imgMax;return new Promise(res=>{
if(f.type.startsWith('image/')){if(f.size>LIMITS.imgRaw)return res({err:`${f.name}: images over 25 MB aren’t accepted`});const url=URL.createObjectURL(f);const img=new Image();
img.onload=()=>{const sc=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,w,h);
let d=c.toDataURL('image/webp',.86);let ext='.webp';if(!d.startsWith('data:image/webp')){d=c.toDataURL('image/jpeg',.88);ext='.jpg'}URL.revokeObjectURL(url);const size=Math.round((d.length-d.indexOf(',')-1)*.75);res({kind:'image',name:f.name.replace(/\.[^.]+$/,'')+ext,size,orig:f.size,data:d,w,h})};
img.onerror=()=>{URL.revokeObjectURL(url);res({err:`${f.name}: couldn’t read this image`})};img.src=url;return}
if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){if(f.size>LIMITS.pdf)return res({err:`${f.name}: PDFs are limited to 10 MB — compress it or share a OneDrive link`});return res({kind:'pdf',name:f.name,size:f.size})}
if(f.type.startsWith('text/')||TEXT_EXT.test(f.name)){if(f.size>LIMITS.text)return res({err:`${f.name}: text files are limited to 1 MB`});return res({kind:'text',name:f.name,size:f.size})}
if(f.type.startsWith('video/'))return res({err:`${f.name}: videos stay on Frame.io / OneDrive — add a link instead`});res({err:`${f.name}: this file type isn’t allowed`})})}
async function handleFiles(list,cb){for(const f of Array.from(list)){const r=await processFile(f);if(r.err){toast(r.err,'bad');continue}if(r.kind==='image'&&r.orig)toast(`${r.name}: ${kb(r.orig)} → ${kb(r.size)} (${r.w}×${r.h})`,'ok');cb(r)}}
function renderPending(){const el=document.getElementById('pend');if(!el)return;el.innerHTML=pending.map((f,i)=>`<div>${f.kind==='image'?`<img src="${f.data}" alt="">`:ic('doc',14)}<span>${esc(f.name)} · ${kb(f.size)}</span><a data-act="unpend" data-arg="${i}" style="cursor:pointer">${ic('x',12)}</a></div>`).join('')}
function parseEDL(text){const out=[];text.split(/\r?\n/).forEach(line=>{const all=line.match(/\d{2}:\d{2}:\d{2}[:;]\d{2}/g);if(/^\s*\d{3,}/.test(line)&&all&&all.length>=4){const s=t=>{const m=t.split(/[:;]/).map(Number);return m[0]*3600+m[1]*60+m[2]+m[3]/25};out.push(Math.max(0,Math.round(s(all[3])-s(all[2]))))}});
if(!out.length)text.split(/\r?\n/).forEach(line=>{const m=line.match(/^\s*(\d+)\s*[,;\t]\s*([\d:.]+)/);if(m){const d=parseMMSS(m[2]);if(d!=null)out.push(d)}});return out}

devStep:a=>{const[id,k]=a.split('|');const d=S.devices.find(x=>x.id===id);d.steps[k]=!d.steps[k];d.log.push({ts:Date.now(),user:meId,text:`${DEV_STEPS.find(s=>s[0]===k)[1]}: ${d.steps[k]?'done':'undone'}`});if(DEV_STEPS.every(s=>d.steps[s[0]])&&d.status!=='Returned'){d.status='Ready to return';d.ingest=100;const p=P(d.project);notify(p?[p.producer]:owners(),`${d.code} is fully backed up and ready to return`,{v:'storage'})}save();devModal(d)},
mktNew:()=>mktForm(),mktOpen:id=>mktForm(S.mkt.find(m=>m.id===id)),
mktMove:a=>{const[id,d]=a.split('|');const m=S.mkt.find(x=>x.id===id);const o=MKT_ST.map(x=>x[0]);const n=o[Math.max(0,Math.min(o.length-1,o.indexOf(m.status)+(+d)))];if(n==='published'&&m.project&&!m.clientOK){toast('Needs the client’s approval before publishing','bad');return}m.status=n;save();render()},

entryRecord:id=>applyEntries([id]),entryRecordAll:()=>applyEntries(S.entries.filter(e=>e.status==='submitted').map(e=>e.id)),
entryReturn:id=>{const e=S.entries.find(x=>x.id===id);modal('Return to '+esc((U(e.by)||{}).name||''),`<form data-form="entryRet" data-arg="${id}" class="col"><p class="muted" style="margin:0">${esc(e.item||e.line)} · ${money(eEGP(e))}</p><label>What needs fixing?<textarea name="note" rows="3" required placeholder="e.g. Amount should be after the 10% discount"></textarea></label><button class="btn pri" type="submit">Return with note</button></form>`)},
brandReset:()=>{BRAND=Object.assign({},BRAND0);brandSave();render();toast('Back to the SCENEDROME defaults','ok')},
brandImgReset:k=>{BRAND[k]=BRAND0[k];brandSave();render()},brandImgNone:k=>{BRAND[k]='';brandSave();render()},
closeModal:()=>closeModal(),closeModalBg:(a,el,e)=>{if(e.target===el)closeModal()}};
const CHG={
switchUser:(a,el)=>login(U(el.value)),
status:(a,el)=>{me().status=el.value;save();render();toast('Status: '+STATUS[el.value][0])},
attachChat:async(a,el)=>{await handleFiles(el.files,r=>{pending.push(r);renderPending()});el.value=''},
uploadFiles:async(pid,el)=>{await uploadTo(pid,el.files);el.value=''},
avatar:async(a,el)=>{const f=el.files[0];if(!f)return;const r=await processFile(f,LIMITS.avatar);if(r.err||r.kind!=='image'){toast(r.err||'Please pick an image','bad');return}me().photo=r.data;save();render();toast(`Photo updated · ${kb(r.orig)} → ${kb(r.size)}`,'ok')},
sceneSt:(a,el)=>{const[e,s]=a.split('|').map(Number);const p=P(V.p);const sc=p.episodes[e-1].scenes[s-1];sc.st=+el.value;if(sc.st&&!sc.dur)sc.dur=60;save();render();toast(`EP${pad2(e)} → ${epProg(p,p.episodes[e-1])}% · show → ${projProg(p)}%`,'ok')},
sceneDur:(a,el)=>{const[e,s]=a.split('|').map(Number);const v=parseMMSS(el.value);if(v==null){toast('Use mm:ss, e.g. 1:42','bad');return}const p=P(V.p);p.episodes[e-1].scenes[s-1].dur=v;save();render()},
epStage:(n,el)=>{const p=P(V.p);const T=TYPES[p.type];const e=p.episodes[+n-1];e.stage=+el.value;if(e.stage>=T.lock)e.scenes.forEach(s=>{if(s.st<3){s.st=3;if(!s.dur)s.dur=60}});notify([p.client,...p.team],`${p.name} EP${pad2(e.n)} moved to ${T.stages[e.stage]}`,{v:'project',p:p.id,tab:'breakdown'});if(p.episodes.every(x=>x.stage>=T.stages.length-1)&&p.status!=='done')markDelivered(p);save();render();toast(`EP${pad2(e.n)} → ${T.stages[e.stage]}`,'ok')},
importEDL:(n,el)=>{const f=el.files[0];if(!f)return;if(f.size>LIMITS.text){toast('EDL/CSV files are limited to 1 MB','bad');return}const r=new FileReader();r.onload=()=>{const durs=parseEDL(String(r.result));if(!durs.length){toast('No events found — expecting an EDL or "scene,duration" CSV','bad');return}const p=P(V.p);const e=p.episodes[+n-1];durs.slice(0,e.scenes.length).forEach((d,i)=>{e.scenes[i].dur=d;if(!e.scenes[i].st)e.scenes[i].st=1});save();render();toast(`Read ${durs.length} events · ${mmss(durs.reduce((a,b)=>a+b,0))} total — mapped to EP${pad2(e.n)}`,'ok')};r.readAsText(f)},
setJob:(id,el)=>{const x=U(id);x.job=el.value;setAccessFromJob(x);save();render();toast(`${first(x)} is now ${jobOf(x).t} — access reset to its defaults`)},
brandSet:(k,el)=>{let v=el.value;if(el.type==='color'||/^#?[0-9a-f]{3,6}$/i.test(v)&&['gold','gold2','text','bgColor','panel'].includes(k)){v=v[0]==='#'?v:'#'+v}else if(['gold','gold2','text','bgColor','panel'].includes(k)){toast('Use a colour like #d6a03d','bad');return}BRAND[k]=v;brandSave();if(el.type!=='color')render();else{const i=document.querySelector(`input[data-arg="${k}"]:not([type=color])`);if(i)i.value=v}},
brandImg:async(k,el)=>{const f=el.files[0];if(!f)return;const r=await brandImage(f,k==='bg'?1920:k==='mark'?512:1200);if(r.err){toast(r.err,'bad');return}BRAND[k]=r.data;brandSave();render();toast('Updated','ok')},
assign:(tid,el)=>{if(!el.value)return;const t=S.tasks.find(x=>x.id===tid);t.assignee=el.value;notify([el.value],`${me().name} assigned you "${t.title}"`,{v:'project',p:t.project,tab:'tasks'});save();render();toast(`Assigned to ${U(el.value).name}`,'ok')},
crewAdd:(pid,el)=>{const id=el.value;if(!id)return;const p=P(pid);const x=U(id);if(x.role==='partner'){p.partners=p.partners||[];p.partners.push(id)}else p.team.push(id);notify([id],`${me().name} added you to ${p.name} 🎬`,{v:'project',p:pid});save();render();toast(`${x.name} joined ${p.name} — they’ve been notified`,'ok')},
finLink:(rid,el)=>{const r=S.fin.rows.find(x=>x.id===rid);r.link=el.value||null;syncLinked();save();render();toast(r.link?'Linked — client and producer views now use these figures':'Unlinked')},
finShare:(rid,el)=>{if(!el.value)return;const r=S.fin.rows.find(x=>x.id===rid);r.share=r.share||[];r.share.push(el.value);save();render();toast(`${U(el.value).name} can now see ${r.name}`,'ok')},
devScan:async(a,el)=>{await scanFolder(el.files);el.value=''},
devIngest:(id,el)=>{const d=S.devices.find(x=>x.id===id);d.ingest=+el.value;if(d.ingest>0&&d.status==='Received')d.status='Ingesting';save();devModal(d)},
devStatus:(id,el)=>{const d=S.devices.find(x=>x.id===id);d.status=el.value;if(['Returned','Sent out','Lent out'].includes(d.status))d.dateOut=Date.now();d.log.push({ts:Date.now(),user:meId,text:'Status → '+d.status});const p=P(d.project);if(p)notify([p.producer],`${d.code} → ${d.status}`,{v:'storage'});save();devModal(d)},
devHolder:(id,el)=>{const d=S.devices.find(x=>x.id===id);d.holder=el.value||null;d.log.push({ts:Date.now(),user:meId,text:d.holder?'Handed to '+U(d.holder).name:'Back in the studio'});if(d.holder)notify([d.holder],`${d.code} (${d.brand} ${d.model}) is now signed out to you`,{v:'storage'});save();devModal(d)}};
async function uploadTo(pid,list){const share=me().role==='client'?['team','client']:['team'];await handleFiles(list,r=>{S.files.push({id:uid('f'),project:pid,name:r.name,kind:r.kind,size:r.size,data:r.kind==='image'?r.data:undefined,by:meId,ts:Date.now(),share})});const p=P(pid);notify(members(p,me().role==='client'?'client':'team'),`${me().name} uploaded files to ${p.name}`,{v:'project',p:pid,tab:'files'});save();render()}
const FORM={
entry:(fd,a)=>{const[pid,kind]=a.split('|');const g=k=>String(fd.get(k)||'').trim();const p=P(pid);const e={id:uid('e'),project:pid,by:meId,kind,item:g('item'),line:g('line'),role:g('role'),amount:+g('amount')||0,cur:g('cur')||'EGP',rate:g('rate')?+g('rate'):null,date:g('date')||new Date().toISOString().slice(0,10),due:g('due'),method:g('method'),ref:g('ref'),note:g('note'),status:'submitted',ts:Date.now()};
if(e.cur==='USD'&&!e.rate){toast('Add the USD rate for a USD amount','bad');return}S.entries.push(e);notify(owners(),`${me().name} entered ${({quote:'a quotation item',payin:'a client payment',cost:'a cost',payout:'a payment made'})[kind]} on ${p.name} (${money(eEGP(e))}) — review it`,{v:'finance'});save();closeModal();render();toast('Sent to the owner for review','ok')},
entryRet:(fd,id)=>{const e=S.entries.find(x=>x.id===id);e.status='returned';e.ret=String(fd.get('note'));notify([e.by],`Returned: ${e.item||e.line} — ${e.ret}`,{v:'project',p:e.project,tab:'money'});save();closeModal();render();toast('Returned with your note')},
login:fd=>{const e=String(fd.get('email')).trim().toLowerCase(),pw=String(fd.get('password'));if(LIVE){bootMsg='';toast('Signing in…');sb.auth.signInWithPassword({email:e,password:pw}).then(({error})=>{if(error){toast(error.message==='Invalid login credentials'?'Email or password doesn’t match':error.message,'bad');return}meId='…';render();liveBoot()});return}const u=S.users.find(x=>x.email.toLowerCase()===e);if(!u||u.pwd!==pw){toast('Email or password doesn’t match','bad');return}login(u)},
send:(fd,a)=>{const[pid,ch]=a.split('|');const text=String(fd.get('text')||'').trim();if(!text&&!pending.length)return;const p=P(pid);
S.msgs.push({id:uid('m'),project:pid,ch,user:meId,text,ts:Date.now(),att:pending.slice(),react:{}});pending.forEach(f=>S.files.push({id:uid('f'),project:pid,name:f.name,kind:f.kind,size:f.size,data:f.kind==='image'?f.data:undefined,by:meId,ts:Date.now(),share:ch==='client'?['team','client']:['team']}));pending=[];
const mem=members(p,ch);const mentioned=[];(text.match(/@([A-Za-z]+)/g)||[]).forEach(t=>{const u=S.users.find(x=>first(x).toLowerCase()===t.slice(1).toLowerCase());if(u&&mem.includes(u.id))mentioned.push(u.id)});
notify(mentioned,`${me().name} mentioned you in ${p.name}: “${text.slice(0,60)}”`,{v:'project',p:pid,tab:'thread',ch});notify(mem.filter(i=>!mentioned.includes(i)),`${me().name} in ${p.name}: “${text.slice(0,60)||'📎 attachment'}”`,{v:'project',p:pid,tab:'thread',ch});save();render()},
profile:fd=>{const u=me();u.name=String(fd.get('name')).trim()||u.name;u.headline=String(fd.get('headline'));u.bio=String(fd.get('bio'));u.status=String(fd.get('status'));u.phone=String(fd.get('phone'));u.lang=String(fd.get('lang'));u.skills=String(fd.get('skills')).split(',').map(s=>s.trim()).filter(Boolean);u.tools=String(fd.get('tools')).split(',').map(s=>s.trim()).filter(Boolean);save();render();toast('Profile saved ✨','ok')},
pwd:fd=>{const u=me();if(LIVE){const a=String(fd.get('n1')),b=String(fd.get('n2'));if(a.length<8){toast('Use at least 8 characters','bad');return}if(a!==b){toast('New passwords don’t match','bad');return}sb.auth.signInWithPassword({email:u.email,password:String(fd.get('cur'))}).then(({error})=>{if(error){toast('Current password is wrong','bad');return}sb.auth.updateUser({password:a}).then(({error})=>{if(error)toast(error.message,'bad');else{render();toast('Password changed 🔒','ok')}})});return}if(fd.get('cur')!==u.pwd){toast('Current password is wrong','bad');return}const a=String(fd.get('n1')),b=String(fd.get('n2'));if(a.length<8){toast('Use at least 8 characters','bad');return}if(a!==b){toast('New passwords don’t match','bad');return}u.pwd=a;save();render();toast('Password changed 🔒','ok')},
task:fd=>{const g=k=>String(fd.get(k)||'');const t={id:uid('t'),project:g('project'),title:g('title'),assignee:g('assignee')||null,stage:+g('stage'),status:'todo',due:new Date(g('due')).getTime()+12*H,prio:g('prio'),brief:g('brief'),created:Date.now(),spec:{codec:g('codec'),res:g('res'),fps:g('fps'),audio:g('audio'),wm:g('wm')||'—',delivery:g('delivery'),link:g('link')}};
if(t.stage>lastStage(P(t.project)))t.stage=0;S.tasks.push(t);if(t.assignee)notify([t.assignee],`${me().name} assigned you "${t.title}"`,{v:'project',p:t.project,tab:'tasks'});save();closeModal();render();toast(t.assignee?`Task created — ${first(U(t.assignee))} has been notified`:'Task created','ok')},
leave:fd=>{const u=me();const l={id:uid('l'),user:u.id,type:String(fd.get('type')),days:+fd.get('days'),from:new Date(String(fd.get('from'))).getTime(),note:String(fd.get('note')||''),status:'pending',ts:Date.now()};S.leaves.push(l);notify([...withPerm('team.leaves'),...owners()],`${u.name} asked for ${l.days} day${l.days>1?'s':''} off`,{v:'team'});save();closeModal();render();toast('Request sent — you’ll be notified when it’s decided','ok')},
eval:(fd,id)=>{const x=U(id);x.perf=Math.max(1,Math.min(5,+fd.get('score')));x.overtime=+fd.get('ot')||0;S.evals.push({id:uid('v'),user:id,by:meId,score:x.perf,note:String(fd.get('note')),ts:Date.now()});notify([id],`${me().name} shared your evaluation (${x.perf.toFixed(1)}/5)`,{v:'profile',p:id});save();closeModal();render();toast('Evaluation saved','ok')},
user:fd=>{const g=k=>String(fd.get(k)||'').trim();if(S.users.some(u=>u.email.toLowerCase()===g('email').toLowerCase())){toast('That email already has an account','bad');return}const j=JOBS[g('job')];
const u=mkUser({id:uid('u'),name:g('name'),email:g('email'),job:g('job'),company:['client','partner'].includes(j.dash)?g('company')||g('name'):undefined,pwd:g('pwd'),color:COLS[S.users.length%COLS.length],joined:new Date().toISOString().slice(0,10)});
if(LIVE){if(g('pwd').length<8){toast('Temporary password needs at least 8 characters','bad');return}toast('Creating the account…');adminCall({action:'create',email:u.email,password:g('pwd'),role:u.role,job:u.job,access:u.access,data:TB[0][2](u).data}).then(r=>{u.id=r.id;delete u.pwd;S.users.push(u);SYNCED.profiles.set(u.id,JSON.stringify(TB[0][2](u)));closeModal();if(isStaff(u))go('access',u.id);else render();toast(`${u.name} can now sign in`,'ok')}).catch(e=>toast(e.message,'bad'));return}
S.users.push(u);save();closeModal();if(isStaff(u))go('access',u.id);else render();toast(`${u.name} can now sign in`,'ok')},
studio:(fd,id)=>{const x=U(id);x.title=String(fd.get('title'));x.dept=String(fd.get('dept'));x.joined=String(fd.get('joined'))||x.joined;x.leave=+fd.get('leave')||0;notify([id],`${me().name} updated your studio info`,{v:'profile',p:id});save();closeModal();render();toast('Studio info saved','ok')},
link:(fd,a)=>{const[pid,kind]=a.split('|');const p=P(pid);const share=fd.get('share')==='both'?['team','client']:['team'];const lbl=String(fd.get('label')),url=String(fd.get('url')),via=String(fd.get('via'));
S.files.push({id:uid('f'),project:pid,name:lbl,kind:'link',via,url,by:meId,ts:Date.now(),share});if(kind==='preview'){p.previews=p.previews||[];p.previews.unshift({id:uid('pv'),label:lbl,via,url,wm:String(fd.get('wm')||'—'),ts:Date.now()})}
notify(share.includes('client')?[p.client,...members(p,'team')]:members(p,'team'),`New ${kind==='preview'?'preview':'link'} on ${p.name}: ${lbl}`,{v:'project',p:pid,tab:kind==='preview'?'overview':'files'});save();closeModal();render();toast('Shared','ok')},
again:(fd,id)=>{const p=P(id);const msg=String(fd.get('msg'));notify([...owners(),...(p?[p.producer]:withPerm('clients.manage'))],`${me().name} (${me().company}) wants to start ${p?'another project like '+p.name:'something new'}: “${msg.slice(0,70)}”`,{v:'clients'});save();closeModal();render();toast('Sent! Your producer will reach out soon 🙌','ok')},
project:fd=>{const g=k=>String(fd.get(k)||'');const type=g('type');const T=TYPES[type];const n=Date.now();const p={id:uid('p'),name:g('name'),type,format:g('format')||T.label,client:g('client'),producer:g('producer'),team:[],partners:[],stage:0,start:n,due:new Date(g('due')).getTime(),status:'active',budget:0,spent:0,quote:0,paid:0,brief:g('brief'),previews:[],spec:{codec:'ProRes 422 HQ',res:'1920×1080',fps:'25',audio:'Stereo 48 kHz',wm:'—',delivery:'OneDrive',link:''}};
if(T.episodic){const k=Math.max(1,Math.min(60,+g('eps')||10));p.episodes=Array.from({length:k},(_,i)=>({n:i+1,stage:0,target:42*60,scenes:Array.from({length:20},(_,j)=>({n:j+1,loc:'—',angles:1,note:'',shot:0,dur:0,st:0}))}))}
S.projects.push(p);notify([p.producer,p.client],`New project: ${p.name}`,{v:'project',p:p.id});save();closeModal();go('project',p.id,'overview');toast('Project created 🎬','ok')},
exp:fd=>{const x={id:uid('x'),by:meId,project:String(fd.get('project'))||null,amount:+fd.get('amount'),note:String(fd.get('note')),ts:Date.now(),status:'pending'};S.expenses.push(x);notify([...owners(),...withPerm('fin.salaries')],`${me().name} sent an expense request (${money(x.amount)})`,{v:'finance'});save();closeModal();render();toast('Sent to the owner','ok')},
dev:(fd,id)=>{const g=k=>String(fd.get(k)||'');const d=id?S.devices.find(x=>x.id===id):{id:uid('d'),dir:'in',status:'Received',dateIn:Date.now(),dateOut:null,holder:meId,ingest:0,steps:{copied:false,checksum:false,second:false,proxies:false},log:[]};
Object.assign(d,{code:g('code'),kind:g('kind'),brand:g('brand'),model:g('model'),sn:g('sn'),owner:g('owner'),client:g('client')||null,project:g('project')||null,capGB:+g('capGB')||0,usedGB:+g('usedGB')||0,location:g('location'),dueBack:g('dueBack')?new Date(g('dueBack')).getTime():null,content:g('content'),files:+g('files')||0,camera:g('camera'),formats:g('formats')?g('formats').split(','):d.formats||[],video:+g('video')||d.video||0});
if(d.owner==='studio'){d.dir='internal';if(!id)d.status='In studio'}
if(!id){d.log.push({ts:Date.now(),user:meId,text:`Logged · ${d.files?nf.format(d.files)+' files · ':''}${gb(d.usedGB)} used`});S.devices.unshift(d);const p=P(d.project);notify(p?[p.producer]:owners(),`${d.code} received${p?' for '+p.name:''} — ${gb(d.usedGB)}`,{v:'storage'})}else d.log.push({ts:Date.now(),user:meId,text:'Details edited'});
save();closeModal();if(V.v!=='storage'&&V.tab!=='drives')go('storage');else render();toast(id?'Saved':`${d.code} logged`,'ok')},
devLog:(fd,id)=>{const d=S.devices.find(x=>x.id===id);d.log.push({ts:Date.now(),user:meId,text:String(fd.get('text'))});save();devModal(d)},
mkt:(fd,id)=>{const g=k=>String(fd.get(k)||'');const m=id?S.mkt.find(x=>x.id===id):{id:uid('k'),status:'idea'};Object.assign(m,{title:g('title'),channel:g('channel'),project:g('project')||null,owner:g('owner'),due:new Date(g('due')).getTime(),clientOK:!!fd.get('clientOK'),note:g('note')});if(!id){S.mkt.push(m);if(m.owner!==meId)notify([m.owner],`New marketing task: ${m.title}`,{v:'marketing'})}save();closeModal();render();toast('Saved','ok')}};

/* ================= events ================= */
document.addEventListener('click',e=>{const bp=document.getElementById('bellpanel');if(bp&&bp.classList.contains('open')&&!e.target.closest('.bellwrap'))bp.classList.remove('open');
const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(!f)return;if(el.tagName==='A'&&!el.getAttribute('href'))e.preventDefault();if(el.dataset.act!=='closeModalBg')e.stopPropagation();f(el.dataset.arg,el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(!el)return;const f=CHG[el.dataset.change];if(f)f(el.dataset.arg,el,e)});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const fn=FORM[f.dataset.form];if(fn)fn(new FormData(f),f.dataset.arg,f)});
document.addEventListener('keydown',e=>{if(e.target.matches&&e.target.matches('.composer textarea')&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const f=e.target.form;if(f.requestSubmit)f.requestSubmit();else f.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}))}if(e.key==='Escape')closeModal()});
document.addEventListener('dragover',e=>{const z=e.target.closest('[data-drop]');if(z){e.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest('[data-drop]');if(z)z.classList.remove('over')});
document.addEventListener('drop',e=>{const z=e.target.closest('[data-drop]');if(!z)return;e.preventDefault();z.classList.remove('over');uploadTo(z.dataset.drop,e.dataTransfer.files)});
document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('.composer textarea')){e.target.style.height='auto';e.target.style.height=Math.min(140,e.target.scrollHeight)+'px'}});
if(LIVE){meId='…';render();liveBoot().catch(e=>{console.error(e);bootMsg='Couldn’t reach the Hub database: '+e.message;booted=false;meId=null;render()});sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'){booted=false;meId=null;render()}})}else render();
})();
</script>
